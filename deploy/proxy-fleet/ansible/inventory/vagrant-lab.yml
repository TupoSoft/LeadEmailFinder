---
all:
  vars:
    vagrant_lab:
      minimum_vagrant_version: "2.4.9"
      primary_machine: "proxy-manager-1"
      box:
        name: "bento/ubuntu-24.04"
        version: "202508.03.0"
        architecture: "amd64"
      resources:
        cpus: 2
        memory_mb: 2048
      virtualbox:
        cpus: 1
      underlay:
        name: "proxy-fleet-lab"
        cidr: "192.168.250.0/24"
        netmask: "255.255.255.0"
        libvirt_host_ip: "192.168.250.1"
      libvirt:
        uri: "qemu:///system"
        management_network:
          name: "vagrant-libvirt"
          address: "192.168.121.0/24"
          mode: "nat"

  hosts:
    proxy-manager-1:
      ansible_host: "proxy-manager-1"
      wireguard_address: "172.29.10.1/28"
      wireguard_endpoint: "192.168.250.11"
      proxy_fleet_allow_reset: true

    proxy-node-a:
      ansible_host: "proxy-node-a"
      wireguard_address: "172.29.10.2/28"
      wireguard_endpoint: "192.168.250.12"
      proxy_fleet_allow_reset: true
      proxy_node_id: "proxy-node-a"
      egress_interface: "lef-egress0"
      proxy_listeners:
        - egressId: "lab-egress-a1"
          bindIp: "172.29.10.2"
          port: 13001
          egressIp: "198.18.0.21"
          maxConnections: 50
          maxConcurrent: 20
          requestsPerMinute: 300
          weight: 1
          desiredState: "active"
        - egressId: "lab-egress-a2"
          bindIp: "172.29.10.2"
          port: 13002
          egressIp: "198.18.0.22"
          maxConnections: 50
          maxConcurrent: 20
          requestsPerMinute: 300
          weight: 1
          desiredState: "active"

    proxy-node-b:
      ansible_host: "proxy-node-b"
      wireguard_address: "172.29.10.3/28"
      wireguard_endpoint: "192.168.250.13"
      proxy_fleet_allow_reset: true
      proxy_node_id: "proxy-node-b"
      egress_interface: "lef-egress0"
      proxy_listeners:
        - egressId: "lab-egress-b1"
          bindIp: "172.29.10.3"
          port: 13001
          egressIp: "198.18.0.23"
          maxConnections: 50
          maxConcurrent: 20
          requestsPerMinute: 300
          weight: 1
          desiredState: "active"

    verifier-1:
      ansible_host: "verifier-1"
      wireguard_address: "172.29.10.4/28"
      wireguard_endpoint: "192.168.250.14"
      proxy_fleet_allow_reset: true

  children:
    swarm_managers:
      hosts:
        proxy-manager-1: {}

    proxy_nodes:
      hosts:
        proxy-node-a: {}
        proxy-node-b: {}

    verification_workers:
      hosts:
        verifier-1: {}

    lab_reset:
      hosts:
        proxy-manager-1: {}
        proxy-node-a: {}
        proxy-node-b: {}
        verifier-1: {}
