# Example proxy-fleet inventory. Contains only documentation placeholders and unroutable example
# addresses (RFC 5737 documentation ranges 192.0.2.0/24 / 198.51.100.0/24 / 203.0.113.0/24 for
# anything that would be a real public/egress address in a live deployment). See README.md for how
# to build a real inventory from this template, including Vault secret setup.
---
all:
  children:
    swarm_managers:
      hosts:
        proxy-manager-1.example.invalid:
          ansible_host: 203.0.113.10
          wireguard_address: "172.29.10.1/28"

    proxy_nodes:
      hosts:
        proxy-node-a.example.invalid:
          ansible_host: 203.0.113.11
          proxy_node_id: "proxy-node-a"
          wireguard_address: "172.29.10.2/28"
          egress_interface: "eth1"
          proxy_listeners:
            - egressId: "egress-a"
              bindIp: "172.29.10.2"
              port: 13001
              egressIp: "203.0.113.21"
              maxConnections: 50
              maxConcurrent: 20
              requestsPerMinute: 300
              weight: 1
              desiredState: "active"

        proxy-node-b.example.invalid:
          ansible_host: 203.0.113.12
          proxy_node_id: "proxy-node-b"
          wireguard_address: "172.29.10.3/28"
          egress_interface: "eth1"
          proxy_listeners:
            - egressId: "egress-b"
              bindIp: "172.29.10.3"
              port: 13001
              egressIp: "203.0.113.22"
              maxConnections: 50
              maxConcurrent: 20
              requestsPerMinute: 300
              weight: 1
              desiredState: "active"

    verification_workers:
      hosts:
        verifier-1.example.invalid:
          ansible_host: 198.51.100.20
          wireguard_address: "172.29.10.20/28"

    # A disposable lab host is added to this group ONLY in a real, non-tracked lab inventory, never
    # here, to opt in to playbooks/reset.yml. See README.md.
    lab_reset:
      hosts: {}
