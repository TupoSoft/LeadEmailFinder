[defaults]
inventory = inventory/example.yml
nocows = True
roles_path = roles
filter_plugins = filter_plugins
retry_files_enabled = False
host_key_checking = True
# No vault_password_file here deliberately: ansible-inventory/--syntax-check must run with no vault
# password configured at all. Real runs pass --vault-password-file or set ANSIBLE_VAULT_PASSWORD_FILE
# explicitly. See README.md.

[privilege_escalation]
become = True
become_method = sudo
