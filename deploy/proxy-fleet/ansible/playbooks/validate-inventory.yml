# Whole-inventory cross-host checks that no single per-host role can see on its own (a role only
# has hostvars for the host it's running against). Imported first by proxy-fleet.yml, and runnable
# standalone: ansible-playbook -i inventory/example.yml playbooks/validate-inventory.yml
#
# See .agents/plans/proxy-fleet/12-ansible-proxy-node-provisioning.md, Acceptance Criteria: "rejects
# duplicate node/egress identities, duplicate endpoints or egress IPs, missing required limits".
---
- name: Validate the whole proxy-fleet inventory before any host is touched
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Collect every proxy_listeners entry across the fleet
      ansible.builtin.set_fact:
        proxy_fleet_all_node_ids: "{{ groups['proxy_nodes'] | map('extract', hostvars, 'proxy_node_id') | list }}"
        proxy_fleet_all_listeners: >-
          {{ groups['proxy_nodes'] | map('extract', hostvars, 'proxy_listeners') | list | sum(start=[]) }}

    - name: Reject an empty proxy_nodes group
      ansible.builtin.assert:
        that: groups['proxy_nodes'] | length > 0
        fail_msg: "Inventory declares no proxy_nodes -- at least one is required."

    - name: Reject a missing or empty swarm_managers group
      ansible.builtin.assert:
        that: groups['swarm_managers'] | length > 0
        fail_msg: "Inventory declares no swarm_managers -- exactly one primary manager is required."

    - name: Reject duplicate proxy_node_id values
      ansible.builtin.assert:
        that: (proxy_fleet_all_node_ids | proxy_fleet_dupes) == []
        fail_msg: "Duplicate proxy_node_id values: {{ proxy_fleet_all_node_ids | proxy_fleet_dupes }}"

    - name: Reject duplicate egressId values
      ansible.builtin.assert:
        that: (proxy_fleet_all_listeners | map(attribute='egressId') | list | proxy_fleet_dupes) == []
        fail_msg: >-
          Duplicate egressId values across the fleet:
          {{ proxy_fleet_all_listeners | map(attribute='egressId') | list | proxy_fleet_dupes }}

    - name: Reject duplicate bindIp/port endpoints
      ansible.builtin.assert:
        that: (proxy_fleet_all_listeners | proxy_fleet_dupes_by('bindIp', 'port')) == []
        fail_msg: >-
          Duplicate bindIp/port endpoints across the fleet:
          {{ proxy_fleet_all_listeners | proxy_fleet_dupes_by('bindIp', 'port') }}

    - name: Reject duplicate egressIp values
      ansible.builtin.assert:
        that: (proxy_fleet_all_listeners | map(attribute='egressIp') | list | proxy_fleet_dupes) == []
        fail_msg: >-
          Duplicate egressIp values across the fleet:
          {{ proxy_fleet_all_listeners | map(attribute='egressIp') | list | proxy_fleet_dupes }}

    - name: Reject listeners missing required registry capacity fields
      ansible.builtin.assert:
        that:
          - item.maxConcurrent is defined
          - item.requestsPerMinute is defined
        fail_msg: "Listener {{ item.egressId }} is missing maxConcurrent and/or requestsPerMinute."
      loop: "{{ proxy_fleet_all_listeners }}"
      loop_control:
        label: "{{ item.egressId }}"

    - name: Reject a desiredState outside active/disabled
      ansible.builtin.assert:
        that: (item.desiredState | default('active')) in ['active', 'disabled']
        fail_msg: "Listener {{ item.egressId }} has an invalid desiredState: {{ item.desiredState | default('active') }}"
      loop: "{{ proxy_fleet_all_listeners }}"
      loop_control:
        label: "{{ item.egressId }}"

    - name: Reject listener ports outside 1-65535
      ansible.builtin.assert:
        that:
          - item.port | int >= 1
          - item.port | int <= 65535
        fail_msg: "Listener {{ item.egressId }} has an out-of-range port: {{ item.port }}"
      loop: "{{ proxy_fleet_all_listeners }}"
      loop_control:
        label: "{{ item.egressId }}"

    - name: Reject non-positive maxConnections
      ansible.builtin.assert:
        that: item.maxConnections | int > 0
        fail_msg: "Listener {{ item.egressId }} has a non-positive maxConnections: {{ item.maxConnections }}"
      loop: "{{ proxy_fleet_all_listeners }}"
      loop_control:
        label: "{{ item.egressId }}"

    - name: Inventory validation passed
      ansible.builtin.debug:
        msg: >-
          {{ groups['proxy_nodes'] | length }} proxy node(s), {{ proxy_fleet_all_listeners | length }}
          listener(s), no duplicate identities or endpoints.
