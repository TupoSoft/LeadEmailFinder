# Read-only Swarm membership inspection. Sets facts consumed by join_or_init.yml. Never runs a
# mutating Docker command -- safe to run standalone against any host, including one already active
# in an unrelated Swarm, which is exactly how this ExecPlan's fail-closed conflict path is verified
# live in an environment with no disposable hosts (see the ExecPlan's Outcomes & Retrospective).
---
- name: Ensure the proxy-fleet state directory exists
  ansible.builtin.file:
    path: "{{ proxy_fleet_state_dir }}"
    state: directory
    mode: "0755"

- name: Inspect current Docker Swarm membership
  ansible.builtin.command:
    cmd: "docker info --format '{% raw %}{{json .Swarm}}{% endraw %}'"
  changed_when: false
  register: proxy_fleet_swarm_info_raw

- name: Parse the Swarm membership inspection
  ansible.builtin.set_fact:
    proxy_fleet_swarm_info: "{{ proxy_fleet_swarm_info_raw.stdout | from_json }}"

- name: Read the locally recorded ClusterID fact file, if any
  ansible.builtin.slurp:
    path: "{{ proxy_fleet_state_dir }}/swarm-cluster-id"
  register: proxy_fleet_swarm_cluster_id_file
  failed_when: false

- name: Record whether a ClusterID fact file exists and its content
  ansible.builtin.set_fact:
    proxy_fleet_swarm_recorded_cluster_id: >-
      {{
        (proxy_fleet_swarm_cluster_id_file.content | b64decode)
        if proxy_fleet_swarm_cluster_id_file.content is defined
        else ''
      }}

- name: Determine whether this host is already correctly part of the swarm this playbook manages
  ansible.builtin.set_fact:
    proxy_fleet_swarm_is_active: "{{ proxy_fleet_swarm_info.LocalNodeState == 'active' }}"
    proxy_fleet_swarm_live_cluster_id: "{{ proxy_fleet_swarm_info.Cluster.ID | default('') }}"
    proxy_fleet_swarm_recognized: >-
      {{
        proxy_fleet_swarm_info.LocalNodeState == 'active'
        and proxy_fleet_swarm_info.Cluster.ID | default('') != ''
        and (
          proxy_fleet_swarm_info.Cluster.ID == proxy_fleet_swarm_recorded_cluster_id
          or proxy_fleet_swarm_info.Cluster.ID == (proxy_fleet_trusted_cluster_id | default(''))
        )
      }}
