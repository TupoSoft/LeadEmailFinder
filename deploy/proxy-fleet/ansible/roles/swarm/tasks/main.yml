# Inspects, initializes/joins, and labels Docker Swarm membership. See inspect.yml, join_or_init.yml,
# and label.yml for the individual stages; this file just orchestrates them in order.
---
- name: Inspect current Swarm membership
  ansible.builtin.include_tasks: inspect.yml

- name: Initialize, join, or fail closed on conflicting membership
  ansible.builtin.include_tasks: join_or_init.yml

- name: Apply proxy-node labels
  ansible.builtin.include_tasks: label.yml
