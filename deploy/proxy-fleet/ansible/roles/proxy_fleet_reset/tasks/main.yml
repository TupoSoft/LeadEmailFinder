# Removes only what the docker_engine/wireguard/firewall/swarm/proxy_topology roles created on this
# host. Only ever invoked by playbooks/reset.yml, which already gates on proxy_fleet_allow_reset and
# lab_reset group membership. Never touches application data or any resource outside the scope below.
#
# The firewall reset assumes -- because this playbook is explicitly restricted to disposable lab
# hosts -- that this host's entire iptables INPUT/FORWARD ruleset was authored by roles/firewall in
# the first place (no unrelated pre-existing rules), so restoring an open default ruleset is
# equivalent to "remove exactly what the firewall role added" for this lab-only scope. This is NOT
# safe to run against a host with independently-managed firewall rules -- see README.md.
---
- name: Remove the rendered listener manifest
  ansible.builtin.file:
    path: "{{ proxy_fleet_manifest_path }}"
    state: absent

- name: Remove the manifest directory if now empty
  ansible.builtin.command:
    cmd: "rmdir {{ proxy_fleet_state_dir }}"
  register: proxy_fleet_reset_rmdir_state_dir
  changed_when: proxy_fleet_reset_rmdir_state_dir.rc == 0
  failed_when: false

- name: Remove the credential staging file
  ansible.builtin.file:
    path: "{{ proxy_fleet_credentials_path }}"
    state: absent

- name: Remove the credential staging directory if now empty
  ansible.builtin.command:
    cmd: "rmdir {{ proxy_fleet_credentials_dir }}"
  register: proxy_fleet_reset_rmdir_credentials_dir
  changed_when: proxy_fleet_reset_rmdir_credentials_dir.rc == 0
  failed_when: false

- name: Render an open default firewall ruleset
  ansible.builtin.template:
    src: iptables-open.rules.j2
    dest: /etc/lead-email-finder/proxy-fleet/iptables-reset.rules
    mode: "0600"

- name: Restore the open default ruleset, removing every proxy-fleet-added rule
  community.general.iptables_state:
    state: restored
    path: /etc/lead-email-finder/proxy-fleet/iptables-reset.rules
  async: "{{ ansible_timeout | default(10) }}"
  poll: 0
  register: proxy_fleet_reset_firewall_apply

- name: Confirm the firewall reset succeeded
  ansible.builtin.async_status:
    jid: "{{ proxy_fleet_reset_firewall_apply.ansible_job_id }}"
  register: proxy_fleet_reset_firewall_result
  until: proxy_fleet_reset_firewall_result.finished
  retries: "{{ ansible_timeout | default(10) }}"
  delay: 1

- name: Disable and stop the WireGuard interface
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: false
    state: stopped

- name: Remove the WireGuard interface configuration
  ansible.builtin.file:
    path: /etc/wireguard/wg0.conf
    state: absent

- name: Remove only the labels this role tree added, from the primary Swarm manager
  when: inventory_hostname in groups['proxy_nodes']
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  block:
    - name: Remove proxy.egress label
      ansible.builtin.command:
        cmd: "docker node update --label-rm proxy.egress {{ ansible_facts['nodename'] }}"
      changed_when: true
      failed_when: false

    - name: Remove proxy.node-id label
      ansible.builtin.command:
        cmd: "docker node update --label-rm proxy.node-id {{ ansible_facts['nodename'] }}"
      changed_when: true
      failed_when: false

- name: Re-inspect Swarm membership before deciding whether to leave
  ansible.builtin.include_role:
    name: swarm
    tasks_from: inspect

- name: Leave the Swarm, but only if it is the one this role tree created
  when:
    - proxy_fleet_swarm_is_active
    - proxy_fleet_swarm_recognized
  block:
    - name: Run `docker swarm leave` (worker)
      ansible.builtin.command:
        cmd: docker swarm leave
      changed_when: true
      when: inventory_hostname != groups['swarm_managers'][0]

    - name: Run `docker swarm leave --force` (sole remaining manager, lab-only)
      ansible.builtin.command:
        cmd: docker swarm leave --force
      changed_when: true
      when: inventory_hostname == groups['swarm_managers'][0]

    - name: Remove the recorded ClusterID fact file
      ansible.builtin.file:
        path: "{{ proxy_fleet_state_dir }}/swarm-cluster-id"
        state: absent
