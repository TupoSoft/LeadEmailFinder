# Renders and safely applies host-input firewall policy: SSH, WireGuard, Swarm control/data traffic
# only from declared private peers, and 3proxy listener ports only from verification-worker WireGuard
# CIDRs. Every rule carries a "proxy-fleet:<rule-id>" comment so playbooks/reset.yml can remove
# exactly these rules later, never a blanket flush.
#
# Applied via community.general.iptables_state's async-rollback pattern (see its module docs' NOTES
# section): running the apply task with async <= ansible_timeout and poll: 0 means the target host
# restores its previous ruleset automatically if the controller's confirmation connection never
# arrives -- e.g. because the very rules just applied cut SSH access. This preserves SSH exactly as
# this ExecPlan requires, with no separate rollback task needed.
---
- name: Build the list of Swarm peer WireGuard addresses, excluding this host
  ansible.builtin.set_fact:
    proxy_fleet_swarm_peer_addresses: >-
      {{
        (groups['swarm_managers'] + groups['proxy_nodes'])
        | unique
        | reject('equalto', inventory_hostname)
        | map('extract', hostvars, 'wireguard_address')
        | map('regex_replace', '/.*$', '')
        | list
      }}

- name: Render the firewall ruleset
  ansible.builtin.template:
    src: iptables.rules.j2
    dest: /etc/lead-email-finder/proxy-fleet/iptables.rules
    mode: "0600"

- name: Apply the rendered ruleset with automatic rollback on connection loss
  community.general.iptables_state:
    state: restored
    path: /etc/lead-email-finder/proxy-fleet/iptables.rules
  async: "{{ ansible_timeout | default(10) }}"
  poll: 0
  register: proxy_fleet_firewall_apply

- name: Confirm the firewall apply succeeded (job must exist -- do not silently continue on connection loss)
  ansible.builtin.async_status:
    jid: "{{ proxy_fleet_firewall_apply.ansible_job_id }}"
  register: proxy_fleet_firewall_result
  until: proxy_fleet_firewall_result.finished
  retries: "{{ ansible_timeout | default(10) }}"
  delay: 1
