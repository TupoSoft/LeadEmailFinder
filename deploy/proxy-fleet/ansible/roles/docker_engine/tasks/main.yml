# Installs and enables Docker Engine from Docker's official apt repository, targeting Ubuntu 24.04
# LTS (noble) per this ExecPlan's Decision Log. Idempotent: a second run against an already-current
# host reports changed=0.
---
- name: Install prerequisite packages for adding Docker's apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine, CLI, containerd, and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start the Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
