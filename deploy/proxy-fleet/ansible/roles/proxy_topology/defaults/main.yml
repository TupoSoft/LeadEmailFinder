---
proxy_fleet_state_dir: /etc/lead-email-finder/proxy-fleet
proxy_fleet_manifest_path: /etc/lead-email-finder/proxy-fleet/listeners.json

# Deliberately distinct from both the manifest path above and plan 11's own container-runtime
# default (/run/secrets/proxy_credentials): this is credential material staged for plan 13's
# automated consumption, not operator-inspectable config. Plan 13 should read this exact path on
# each proxy node when constructing its node-specific immutable Swarm secret.
proxy_fleet_credentials_dir: /var/lib/lead-email-finder/proxy-fleet
proxy_fleet_credentials_path: /var/lib/lead-email-finder/proxy-fleet/credentials.json
