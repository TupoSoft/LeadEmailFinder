# Validates egress IPs against the declared interface and renders the plan-11-shaped manifest plus
# the credential staging file for plan 13. Never starts 3proxy -- that is plan 13's responsibility.
---
- name: Determine this host's addresses assigned to egress_interface
  ansible.builtin.set_fact:
    proxy_fleet_egress_interface_addresses: >-
      {{
        (
          [ansible_facts[egress_interface].ipv4.address | default(omit)]
          if ansible_facts[egress_interface] is defined and ansible_facts[egress_interface].ipv4 is defined
          else []
        )
        + (
          ansible_facts[egress_interface].ipv4_secondaries | default([]) | map(attribute='address') | list
          if ansible_facts[egress_interface] is defined
          else []
        )
      }}

- name: Validate every declared egressIp is assigned to egress_interface
  ansible.builtin.assert:
    that: item.egressIp in proxy_fleet_egress_interface_addresses
    fail_msg: >-
      egressIp {{ item.egressIp }} for listener {{ item.egressId }} is not assigned to
      {{ egress_interface }} on {{ inventory_hostname }} (assigned addresses:
      {{ proxy_fleet_egress_interface_addresses }}). Note: this check is deliberately scoped to
      only the declared egress_interface, unlike plan 11's own container-side check, which scans
      every interface in the network namespace -- see this ExecPlan's Plan of Work.
  loop: "{{ proxy_listeners }}"
  loop_control:
    label: "{{ item.egressId }}"

- name: Assert vault_proxy_credentials exactly matches this host's listener egressIds
  ansible.builtin.assert:
    that:
      - (proxy_listeners | map(attribute='egressId') | list | sort) == (vault_proxy_credentials.keys() | list | sort)
    fail_msg: >-
      vault_proxy_credentials on {{ inventory_hostname }} does not match its proxy_listeners
      egressId set 1:1 (listeners: {{ proxy_listeners | map(attribute='egressId') | list | sort }},
      credentials: {{ vault_proxy_credentials.keys() | list | sort }}).
  no_log: true

- name: Ensure the proxy-fleet state directory exists
  ansible.builtin.file:
    path: "{{ proxy_fleet_state_dir }}"
    state: directory
    mode: "0755"

- name: Render the plan-11-shaped listener manifest
  ansible.builtin.template:
    src: listeners.json.j2
    dest: "{{ proxy_fleet_manifest_path }}"
    mode: "0644"

- name: Ensure the root-only credential staging directory exists
  ansible.builtin.file:
    path: "{{ proxy_fleet_credentials_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Render the credential staging file for plan 13
  ansible.builtin.template:
    src: credentials.json.j2
    dest: "{{ proxy_fleet_credentials_path }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  diff: false
