# Installs WireGuard and renders a full-mesh peer configuration from inventory. Each host's own
# private key comes from Vault (host_vars/<host>/vault.yml -> vault_wireguard_private_key, referenced
# by host_vars/<host>/vars.yml as wireguard_private_key); public keys are plain, non-secret inventory
# vars (wireguard_public_key) since WireGuard public keys carry no secrecy requirement.
---
- name: Install wireguard-tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create /etc/wireguard with restrictive permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Build this fleet's full peer list, excluding this host
  ansible.builtin.set_fact:
    proxy_fleet_wireguard_peers: >-
      {{
        (groups['swarm_managers'] + groups['proxy_nodes'] + groups['verification_workers'])
        | unique
        | reject('equalto', inventory_hostname)
        | map('extract', hostvars)
        | list
      }}

- name: Render the WireGuard interface configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  no_log: true
  notify: Restart wireguard

- name: Enable and start the WireGuard interface
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Flush handlers so a changed wg0.conf takes effect within this play
  ansible.builtin.meta: flush_handlers
