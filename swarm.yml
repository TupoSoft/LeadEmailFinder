version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:2a76ee8c28d417bd3056b49d61a37da41bde0142
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: sh -c "pnpm start | pino-gelf log"
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/api/v0/ping" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_TOKENS_FILE: /run/secrets/tokens.json
      MONGO_URL_FILE: /run/secrets/mongo_url
      JWT_HS256_SECRET_FILE: /run/secrets/jwt_hs256_secret
      PINO_GELF_HOST: graylog.eu.tuposoft.internal
      BASE_URL: https://p1.leademailfinder.com
      JWT_ISSUER: LeadEmailFinder
      JWT_AUDIENCE: LeadEmailFinder
    deploy:
      mode: replicated
      replicas: 4
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
      - tokens.json
      - redis_url
      - jwt_hs256_secret
    networks:
      - default
      - redis_default
      - mongo_default
      - graylog_graylog

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true
  tokens.json:
    external: true
  redis_url:
    external: true
  jwt_hs256_secret:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
  graylog_graylog:
    external: true
