version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:404d60690095fed895a6fe16cee607581f8dde1c
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: sh -c "pnpm start | pino-gelf log"
    healthcheck:
      test: curl -s http://localhost:3000/health | jq -e '.status == "ok"' > /dev/null
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      NODE_ENV: production
      API_URL: https://api.leademailfinder.com
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_TOKENS_FILE: /run/secrets/tokens.json
      MONGO_URL_FILE: /run/secrets/mongo_url
      JWT_HS256_SECRET_FILE: /run/secrets/jwt_hs256_secret
      PINO_GELF_HOST: graylog.eu.tuposoft.internal
      JWT_ISSUER: LeadEmailFinder
      JWT_AUDIENCE: LeadEmailFinder
      CATCH_ALL_HTTP_PROXY_URL_FILE: /run/secrets/catch_all_http_proxy_url
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_URL: /run/secrets/s3_url
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: lead-email-finder
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: "1"
          memory: 1g
      placement:
        max_replicas_per_node: 2
        preferences:
          - spread: node.hostname
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
      - tokens.json
      - redis_url
      - jwt_hs256_secret
      - catch_all_http_proxy_url
      - s3_access_key_id
      - s3_url
      - s3_secret_key
    networks:
      - default
      - redis_default
      - mongo_default
      - graylog_graylog

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true
  tokens.json:
    external: true
  redis_url:
    name: redis-url-03102025
    external: true
  jwt_hs256_secret:
    external: true
  catch_all_http_proxy_url:
    external: true
  s3_access_key_id:
    external: true
  s3_secret_key:
    external: true
  s3_url:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
  graylog_graylog:
    external: true
