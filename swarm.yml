version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:36ca1f7e6904d4570fa805da87e06aeed84634ee
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      REDIS_CONFIG_FILE_PATH: /run/secrets/redis-config.json
      MONGO_URL_FILE: /run/secrets/mongo_url
    deploy:
      mode: global
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
    networks:
      - default
      - redis_default
      - mongo_default

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
