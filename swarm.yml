version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:b7fd34a83e2d19bfed1fd2a97b3abdd2095cc661
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: sh -c "pnpm start | pino-gelf log"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      REDIS_URL: /run/secrets/redis_url
      AUTH_TOKENS_FILE_PATH: /run/secrets/tokens.json
      MONGO_URL_FILE: /run/secrets/mongo_url
      PINO_GELF_HOST: graylog.eu.tuposoft.internal
    deploy:
      mode: replicated
      replicas: 8
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
      - tokens.json
      - redis_url
    networks:
      - default
      - redis_default
      - mongo_default
      - graylog_graylog

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true
  tokens.json:
    external: true
  redis_url:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
  graylog_graylog:
    external: true
