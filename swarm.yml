version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:4ddb09857a613c5293574265be2e5b9341e70b58
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      REDIS_CONFIG_FILE_PATH: /run/secrets/redis-config.json
      AUTH_TOKENS_FILE_PATH: /run/secrets/tokens.json
      MONGO_URL_FILE: /run/secrets/mongo_url
    deploy:
      mode: replicated
      replicas: 8
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
      - tokens.json
    networks:
      - default
      - redis_default
      - mongo_default

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true
  tokens.json:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
