version: '3.9'

services:
  finder:
    image: ghcr.io/tuposoft/leademailfinder:8fe291467a3eadee0e1350d2c72d82c8a87a73e0
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: pnpm start | pino-gelf
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      REDIS_CONFIG_FILE_PATH: /run/secrets/redis-config.json
      AUTH_TOKENS_FILE_PATH: /run/secrets/tokens.json
      MONGO_URL_FILE: /run/secrets/mongo_url
      PINO_GELF_HOST: graylog_eu
    deploy:
      mode: replicated
      replicas: 8
    secrets:
      - mongo_url
      - source: redis-config
        target: redis-config.json
      - tokens.json
    networks:
      - default
      - redis_default
      - mongo_default
      - graylog_graylog

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true
  tokens.json:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
  graylog_graylog:
    external: true
