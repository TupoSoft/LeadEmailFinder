name: LEF apps

include:
  - infra.yaml

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TARGET_APP: lead-email-finder-api
    volumes:
      - "..:/app"
      - "/app/node_modules"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:3000/health | jq -e '.status == "ok"' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      API_URL: http://localhost:3000
      APIKEY_URL: api-key:5000
      REDIS_URL_FILE: /run/secrets/redis_url
      MONGO_URL_FILE: /run/secrets/mongo_url
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true
      S3_BUCKET: batch-email-verification
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api-key:
        condition: service_started
    secrets:
      - mongo_url
      - redis_url
      - s3_access_key_id
      - s3_secret_key
      - apikey_mongo_url

  api-key:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TARGET_APP: api-key
    volumes:
      - "..:/app"
      - "/app/node_modules"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '5000:5000'
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    secrets:
      - apikey_mongo_url
    environment:
      APIKEY_MONGO_URL_FILE: /run/secrets/apikey_mongo_url

  async-email-verification-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TARGET_APP: async-email-verification-worker
    volumes:
      - "..:/app"
      - "/app/node_modules"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
