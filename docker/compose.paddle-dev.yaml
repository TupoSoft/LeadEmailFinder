services:
  api:
    environment:
      # The verification workflow mints its M2M token through this container-internal issuer, so the issuer
      # claim and the API's validation target must use the same URL.
      OIDC_ISSUER_URL: http://keycloak:8080/realms/lead-email-finder
      PAYMENTS_PROVIDER: paddle
      PAYMENTS_CREDIT_PACKS: '{"starter":{"credits":100,"amountMinor":500,"currency":"USD","providerPriceId":"${PADDLE_STARTER_PRICE_ID:?Set PADDLE_STARTER_PRICE_ID to the sandbox pri_ identifier}"}}'
      PAYMENTS_CHECKOUT_URL: http://localhost:57000/checkout.html
      PADDLE_API_KEY_FILE: /run/secrets/paddle_api_key
      PADDLE_WEBHOOK_SECRET_FILE: /run/secrets/paddle_webhook_secret
      PADDLE_ENVIRONMENT: sandbox
    depends_on:
      paddle-checkout:
        condition: service_healthy
    secrets:
      - paddle_api_key
      - paddle_webhook_secret

  paddle-checkout:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    ports:
      - '57000:80'
    volumes:
      - ./paddle-dev/checkout.html.template:/paddle-dev/checkout.html.template:ro
      - ./paddle-dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./paddle-dev/render-checkout.sh:/paddle-dev/render-checkout.sh:ro
    secrets:
      - paddle_client_token
    entrypoint: ["/bin/sh", "/paddle-dev/render-checkout.sh"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  paddle-webhook-tunnel:
    image: cloudflare/cloudflared:2026.7.2
    restart: "no"
    command: ["tunnel", "--no-autoupdate", "--url", "http://host.docker.internal:53000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

secrets:
  paddle_api_key:
    file: ../.dev/paddle/api-key.txt
  paddle_webhook_secret:
    file: ../.dev/paddle/webhook-secret.txt
  paddle_client_token:
    file: ../.dev/paddle/client-token.txt
