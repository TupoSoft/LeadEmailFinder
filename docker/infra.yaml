services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: lef
    ports:
      - '55432:5432'
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - '56379:6379'
    healthcheck:
      test: "[ `redis-cli ping` = 'PONG' ]"
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - redis-data:/data

  bullboard:
    image: venatum/bull-board:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '54000:3000'

  garage:
    build:
      context: ..
      dockerfile: docker/garage.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - '59000:3900'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    secrets:
      - s3_access_key_id
      - s3_secret_key

secrets:
  postgres_password:
    file: secrets/postgres_password.txt
  postgres_url:
    file: secrets/postgres_url.txt
  redis_url:
    file: secrets/redis_url.txt
  tokens.json:
    file: secrets/tokens.json
  admin_apikey:
    file: secrets/admin_apikey.txt
  s3_access_key_id:
    file: secrets/s3_access_key_id.txt
  s3_secret_key:
    file: secrets/s3_secret_key.txt

volumes:
  postgres-data:
  redis-data:
