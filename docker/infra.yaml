services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: lef
    ports:
      - '55432:5432'
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - '56379:6379'
    healthcheck:
      test: "[ `redis-cli ping` = 'PONG' ]"
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - redis-data:/data

  bullboard:
    image: venatum/bull-board:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '54000:3000'

  garage:
    build:
      context: ..
      dockerfile: docker/garage.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - '59000:3900'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    secrets:
      - s3_access_key_id
      - s3_secret_key

  keycloak-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-development-only}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--health-enabled=true"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-development-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-development-only}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - '58080:8080'

secrets:
  postgres_password:
    file: secrets/postgres_password.txt
  postgres_url:
    file: secrets/postgres_url.txt
  redis_url:
    file: secrets/redis_url.txt
  tokens.json:
    file: secrets/tokens.json
  admin_apikey:
    file: secrets/admin_apikey.txt
  s3_access_key_id:
    file: secrets/s3_access_key_id.txt
  s3_secret_key:
    file: secrets/s3_secret_key.txt
  session_encryption_key:
    file: secrets/session_encryption_key.txt
  bff_client_secret:
    file: secrets/bff_client_secret.txt
  keycloak_org_admin_client_secret:
    file: secrets/keycloak_org_admin_client_secret.txt

volumes:
  postgres-data:
  redis-data:
  keycloak-postgres-data:
