services:
    credits-postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${CREDITS_TEST_PASSWORD:?Set CREDITS_TEST_PASSWORD}
            POSTGRES_DB: credits_test
        ports:
            - '127.0.0.1::5432'
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d credits_test']
            interval: 1s
            timeout: 5s
            retries: 60
