services:
  api:
    dns: !override
      - 172.28.0.53
    environment:
      SMTP_PORT: 2525
      # The base stack's OIDC_ISSUER_URL (http://localhost:58080/...) is host-facing, for the browser-driven
      # BFF login redirect (see docker/compose.yaml). Inside this container's own network namespace, "localhost"
      # is the container itself, not Keycloak, so the containerized api can neither fetch JWKS nor validate an
      # incoming token's issuer claim against that URL. Override to the container-internal Keycloak service
      # name for this overlay only, which never drives a browser login (see bootstrap-proxy.sh, which requests
      # its own tokens from this same host so the issued token's iss claim matches).
      OIDC_ISSUER_URL: http://keycloak:8080/realms/lead-email-finder
    depends_on:
      coredns:
        condition: service_started
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      smtp-dev-dns-cache-reset:
        condition: service_completed_successfully
      smtp-dev-proxy:
        condition: service_started

  coredns:
    image: coredns/coredns:1.14.6
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    volumes:
      - ./smtp-dev/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./smtp-dev/coredns/lef.test.zone:/etc/coredns/lef.test.zone:ro
    networks:
      default:
        ipv4_address: 172.28.0.53

  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    environment:
      MP_DISABLE_VERSION_CHECK: true
      MP_SMTP_BIND_ADDR: 0.0.0.0:2525
      MP_SMTP_DISABLE_RDNS: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      default:
        ipv4_address: 172.28.0.25

  smtp-dev-proxy:
    image: ghcr.io/3proxy/3proxy:0.9.8
    restart: unless-stopped
    volumes:
      - ./smtp-dev/3proxy.cfg:/etc/3proxy/3proxy.cfg:ro
    networks:
      default:
        ipv4_address: 172.28.0.108

  smtp-dev-dns-cache-reset:
    image: redis:alpine
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        keys="$$(redis-cli -h redis --scan --pattern 'DNS_CACHE:*')"
        if [ -n "$$keys" ]; then
          printf '%s\n' "$$keys" | xargs -r redis-cli -h redis del
        fi

  smtp-dev-proxy-bootstrap:
    image: curlimages/curl:8.16.0
    restart: "no"
    dns:
      - 172.28.0.53
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      smtp-dev-dns-cache-reset:
        condition: service_completed_successfully
      smtp-dev-proxy:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap-proxy.sh", "reconcile"]
    volumes:
      - ./smtp-dev/bootstrap-proxy.sh:/bootstrap-proxy.sh:ro
      # Written by `pnpm keycloak:provision` (clientId/clientSecret for the seeded lef-development-service
      # M2M client), not a fixed checked-in Docker secret: run `pnpm keycloak:provision` and
      # `pnpm keycloak:bootstrap-credential` before bringing this overlay up. Disabling implicit host-path
      # creation keeps Docker from turning a missing credentials file into a directory.
      - type: bind
        source: ../.dev/keycloak/service-client.json
        target: /service-client.json
        read_only: true
        bind:
          create_host_path: false

  smtp-dev-proxy-cleanup:
    image: curlimages/curl:8.16.0
    profiles: ["smtp-dev-cleanup"]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap-proxy.sh", "cleanup"]
    volumes:
      - ./smtp-dev/bootstrap-proxy.sh:/bootstrap-proxy.sh:ro
      - type: bind
        source: ../.dev/keycloak/service-client.json
        target: /service-client.json
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
