services:
  api:
    networks:
      default: {}
      smtp-dev: {}
    dns: !override
      - 172.28.0.53
    environment:
      SMTP_PORT: 2525
      SMTP_TLS_CA_FILE: /smtp-dev-tls/ca.crt
    volumes:
      - ./smtp-dev/tls/ca.crt:/smtp-dev-tls/ca.crt:ro
    depends_on:
      coredns:
        condition: service_started
      keycloak:
        condition: service_healthy
      smtp-evidence:
        condition: service_healthy
      plaintext-mailpit:
        condition: service_healthy
      smtp-dev-dns-cache-reset:
        condition: service_completed_successfully
      smtp-dev-proxy:
        condition: service_started

  coredns:
    image: coredns/coredns:1.14.6
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    volumes:
      - ./smtp-dev/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./smtp-dev/coredns/lef.test.zone:/etc/coredns/lef.test.zone:ro
    networks:
      default: {}
      smtp-dev:
        ipv4_address: 172.28.0.53

  smtp-evidence:
    image: node:24-alpine
    restart: unless-stopped
    environment:
      EVIDENCE_HOSTNAME: smtp.lef.test
      EVIDENCE_SMTP_PORT: 2525
      EVIDENCE_CONTROL_PORT: 8025
      EVIDENCE_TLS_CERT_FILE: /smtp-dev-tls/smtp.crt
      EVIDENCE_TLS_KEY_FILE: /smtp-dev-tls/smtp.key
    volumes:
      - ./smtp-dev/evidence-server.mjs:/evidence-server.mjs:ro
      - ./smtp-dev/tls/smtp.crt:/smtp-dev-tls/smtp.crt:ro
      - ./smtp-dev/tls/smtp.key:/smtp-dev-tls/smtp.key:ro
    entrypoint: ["node", "/evidence-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8025/counters').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      smtp-dev:
        ipv4_address: 172.28.0.25

  plaintext-mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    environment:
      MP_DISABLE_VERSION_CHECK: true
      MP_SMTP_BIND_ADDR: 0.0.0.0:2525
      MP_SMTP_DISABLE_RDNS: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      smtp-dev:
        ipv4_address: 172.28.0.26

  smtp-dev-proxy:
    image: ghcr.io/3proxy/3proxy:0.9.8
    restart: unless-stopped
    volumes:
      - ./smtp-dev/3proxy.cfg:/etc/3proxy/3proxy.cfg:ro
    networks:
      smtp-dev:
        ipv4_address: 172.28.0.108

  smtp-dev-dns-cache-reset:
    image: redis:alpine
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        keys="$$(redis-cli -h redis --scan --pattern 'DNS_CACHE:*')"
        if [ -n "$$keys" ]; then
          printf '%s\n' "$$keys" | xargs -r redis-cli -h redis del
        fi

  smtp-dev-proxy-bootstrap:
    user: "0:0"
    image: curlimages/curl:8.16.0
    restart: "no"
    networks:
      default: {}
      smtp-dev: {}
    dns:
      - 172.28.0.53
    depends_on:
      api:
        condition: service_healthy
      smtp-evidence:
        condition: service_healthy
      plaintext-mailpit:
        condition: service_healthy
      smtp-dev-dns-cache-reset:
        condition: service_completed_successfully
      smtp-dev-proxy:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap-proxy.sh", "reconcile"]
    volumes:
      - ./smtp-dev/bootstrap-proxy.sh:/bootstrap-proxy.sh:ro
      # The host bootstrap writes a checkout-owned 0600 platform API key. The fixed-purpose curl
      # container runs as root only to read that private bind mount. Missing files fail closed.
      - type: bind
        source: ../.dev/auth/platform-api-key.json
        target: /api-key.json
        read_only: true
        bind:
          create_host_path: false

  smtp-dev-proxy-cleanup:
    user: "0:0"
    image: curlimages/curl:8.16.0
    profiles: ["smtp-dev-cleanup"]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap-proxy.sh", "cleanup"]
    volumes:
      - ./smtp-dev/bootstrap-proxy.sh:/bootstrap-proxy.sh:ro
      - type: bind
        source: ../.dev/auth/platform-api-key.json
        target: /api-key.json
        read_only: true
        bind:
          create_host_path: false

networks:
  # Keep the base network unchanged when enabling or disabling this overlay.
  # Replacing it can drop service aliases on reused infrastructure containers.
  smtp-dev:
    ipam:
      config:
        - subnet: 172.28.0.0/24
