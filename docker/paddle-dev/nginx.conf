server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /checkout.html {
        add_header Cache-Control 'no-store';
        try_files /checkout.html =404;
    }

    location / {
        return 404;
    }
}
