server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/lef;
    index index.html;
    # Evaluate the fixed label before an SPA internal redirect changes $uri.
    set $request_path_label $safe_path;

    # Docker DNS is resolved per request so static health does not require API DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:3000;

    # Keep these ownership expressions aligned with gateway-routes.ts.
    # Retired namespaces remain API-owned so their 404s cannot become SPA HTML.
    location ~ ^/(?:v1|verifyBatch|emails|credits|docs)(?:/|$) {
        include /etc/nginx/web/proxy.conf;
    }
    location ~ ^/(?:health|openapi\.json|docs-json|docs-yaml)$ {
        include /etc/nginx/web/proxy.conf;
    }

    location /assets/ {
        include /etc/nginx/web/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/web/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Container-only health proves the built static entry exists with no API request.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    root /usr/share/nginx/lef;
    location = /health {
        try_files /index.html =503;
    }
    location / {
        return 404;
    }
}
