# The API owns upload limits, including the existing 100 MiB CSV contract.
client_max_body_size 0;
proxy_pass http://$api_upstream$request_uri;
proxy_http_version 1.1;
# Synchronous SMTP verification can span several five-minute protocol stages.
proxy_read_timeout 1h;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $forwarded_port;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Connection "";
proxy_redirect off;
proxy_cache off;
proxy_intercept_errors off;
# Streaming request bodies avoid buffering private API input into temporary files.
proxy_request_buffering off;
proxy_buffering off;
