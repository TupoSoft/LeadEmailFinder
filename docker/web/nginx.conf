worker_processes auto;
pid /tmp/nginx.pid;

# Nginx error messages cannot be formatted and may contain a raw request target.
# Keep request failures in the structured, fixed-label access log instead.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $request_method $safe_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }

    # Only literal labels reach logs, including unknown and future descendants.
    map $uri $safe_path {
        default /ui;
        / /;
        /health /health;
        /openapi.json /openapi.json;
        /docs-json /docs-json;
        /docs-yaml /docs-yaml;
        ~^/v1/auth/callback(?:/|$) /v1/auth/callback;
        ~^/v1/auth/login(?:/|$) /v1/auth/login;
        ~^/v1/auth/logout(?:/|$) /v1/auth/logout;
        ~^/emails(?:/|$) /emails/:sensitive;
        ~^/v1(?:/|$) /v1/*;
        ~^/verify(?:/|$) /verify/*;
        ~^/verifyAsync(?:/|$) /verifyAsync/*;
        ~^/verifyBatch(?:/|$) /verifyBatch/*;
        ~^/credits(?:/|$) /credits/*;
        ~^/docs(?:/|$) /docs/*;
        ~^/assets(?:/|$) /assets/*;
    }

    map $http_host $forwarded_port {
        default 80;
        ~:(?<host_port>[0-9]+)$ $host_port;
    }

    log_format safe_json escape=json '{"method":"$safe_method","path":"$request_path_label","status":$status,"requestId":"$request_id"}';
    access_log /dev/stdout safe_json;
    include /etc/nginx/conf.d/*.conf;
}
