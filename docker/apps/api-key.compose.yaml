services:
  api-key:
    extends:
      file: templates/grpc-app.compose.yaml
      service: grpc-app
    build:
      args:
        TARGET_APP: api-key
    ports:
      - '55000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    secrets:
      - mongo_url
    environment:
      TARGET_APP: api-key
      MONGO_URL_FILE: /run/secrets/mongo_url

  api-key-debug:
    extends:
      service: api-key
    command:
      - pnpm
      - debug
      - api-key
    ports:
      - '59230:9229'
    profiles: !override [debug]
