services:
  proxy:
    extends:
      service: grpc-app
      file: templates/grpc-app.compose.yaml
    build:
      args:
        TARGET_APP: proxy
    ports:
      - '55001:5000'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      TARGET_APP: proxy
      MONGO_URL_FILE: /run/secrets/mongo_url
    secrets:
      - mongo_url

  proxy-debug:
    extends:
      service: proxy
    command:
      - pnpm
      - debug
      - proxy
    ports:
      - '59232:9229'
    profiles: !override [debug]
