services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        TARGET_APP: lead-email-finder-api
    volumes:
      - "../..:/app"
      - "/app/node_modules"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '53000:3000'
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:3000/health | jq -e '.status == "ok"' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      API_URL: http://localhost:3000
      REDIS_URL_FILE: /run/secrets/redis_url
      POSTGRES_URL_FILE: /run/secrets/postgres_url
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_URL: http://garage:3900
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true
      S3_BUCKET: batch-email-verification
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    secrets:
      - postgres_url
      - redis_url
      - s3_access_key_id
      - s3_secret_key
    profiles:
      - dev

  api-debug:
    extends:
      service: api
    command:
      - pnpm
      - debug
      - lead-email-finder-api
    ports:
      - '9229:9229'
    profiles: !override [debug]
