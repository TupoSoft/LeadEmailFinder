services:
  async-email-verification-worker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        TARGET_APP: async-email-verification-worker
    volumes:
      - "../..:/app"
      - "/app/node_modules"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev

  async-email-verification-worker-debug:
    extends:
      service: async-email-verification-worker
    command:
      - pnpm
      - debug
      - async-email-verification-worker
    ports:
      - '59231:9229'
    profiles: !override [debug]
