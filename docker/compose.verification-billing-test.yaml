services:
    verification-billing-postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${VERIFICATION_BILLING_TEST_PASSWORD:?Set by test:verification-billing-postgres}
            POSTGRES_DB: verification_billing_test
        ports:
            - '127.0.0.1::5432'
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d verification_billing_test']
            interval: 1s
            timeout: 5s
            retries: 60
