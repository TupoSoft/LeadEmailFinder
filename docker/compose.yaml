services:
  verifier:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    develop:
      watch:
        - action: sync+restart
          path: ../src
          target: /app/src
        - action: rebuild
          path: ../package.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      MONGO_URL_FILE: /run/secrets/mongo_url
      PROXY_FILE: /run/secrets/proxies
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - mongo_url
      - proxies

  mongo:
    image: mongo:latest
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
    environment:
      MONGO_INITDB_DATABASE: verifier
      MONGO_URL_FILE: /run/secrets/mongo_url
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      # A comma-separated string of proxies to insert on startup,
      # e.g. http://login:password@example.com:3333, socks5://foo:bar@example.com:4444
      PROXIES: ${PROXIES}
    ports:
      - "27017:27017"
    secrets:
      - mongo_root_username
      - mongo_root_password
      - mongo_url
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: "[ $$(redis-cli ping) = 'PONG' ]"
      interval: 1s
      timeout: 3s
      retries: 5

secrets:
  mongo_root_username:
    file: ./secrets/mongo_root_username.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_url:
    file: ./secrets/mongo_url.txt
  proxies:
    file: ./secrets/proxies.json

volumes:
  mongo-data:
