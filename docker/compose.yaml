name: LEF

include:
  - infra.yaml

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-53000}:8080'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - "..:/app"
      - "/app/node_modules"
    develop:
      watch:
        - action: rebuild
          path: ../package.json
    dns:
      - 1.1.1.1
      - 8.8.8.8
    expose:
      - '3000'
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:3000/health | jq -e '.status == "ok"' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_URL: http://localhost:3000
      TYPEORM_SYNCHRONIZE: true

      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-58080}/realms/lead-email-finder
      OIDC_BACKCHANNEL_URL: http://keycloak:8080/realms/lead-email-finder
      OIDC_AUDIENCE: lead-email-finder-api
      # Browser redirects and issuer validation remain public; protocol calls and both verifiers' key
      # retrieval use the Compose network. An internal transport address never becomes a trusted issuer.
      OIDC_JWKS_URI: http://keycloak:8080/realms/lead-email-finder/protocol/openid-connect/certs

      APP_BASE_URL: http://localhost:${WEB_PORT:-53000}
      BFF_CLIENT_ID: lef-web-bff
      BFF_CLIENT_SECRET_FILE: /run/secrets/bff_client_secret
      SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key

      PAYMENTS_PROVIDER: stub
      PAYMENTS_CREDIT_PACKS: '{"starter":{"credits":100,"amountMinor":500,"currency":"USD","providerPriceId":"stub_starter"},"growth":{"credits":500,"amountMinor":2000,"currency":"USD","providerPriceId":"stub_growth"}}'
      PAYMENTS_CHECKOUT_URL: http://localhost:${WEB_PORT:-53000}/billing/complete
      PAYMENTS_STUB_WEBHOOK_SECRET_FILE: /run/secrets/payments_stub_webhook_secret

      KEYCLOAK_ORG_ADMIN_CLIENT_ID: lef-org-admin-service
      KEYCLOAK_ORG_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_org_admin_client_secret
      KEYCLOAK_ADMIN_API_BASE_URL: http://keycloak:8080

      REDIS_URL_FILE: /run/secrets/redis_url

      POSTGRES_URL_FILE: /run/secrets/postgres_url

      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_URL: http://garage:3900
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true
      S3_BUCKET: batch-email-verification
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    secrets:
      - postgres_url
      - redis_url
      - s3_access_key_id
      - s3_secret_key
      - session_encryption_key
      - bff_client_secret
      - keycloak_org_admin_client_secret
      - payments_stub_webhook_secret

secrets:
  postgres_url:
    file: secrets/postgres_url.txt
