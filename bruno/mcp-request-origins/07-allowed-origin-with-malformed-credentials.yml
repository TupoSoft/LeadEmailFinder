info:
  name: 07-allowed-origin-with-malformed-credentials
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Origin
      value: "{{allowedOrigin}}"
    - name: Authorization
      value: "Basic !!!"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-06-18",
          "capabilities": {},
          "clientInfo": { "name": "bruno", "version": "0.0.0" }
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('an allowed origin with a malformed Basic credential is rejected by authentication', function() {
          expect(res.status).to.equal(401);
          expect(res.body).to.eql({ error: 'authentication_required' });
        });
