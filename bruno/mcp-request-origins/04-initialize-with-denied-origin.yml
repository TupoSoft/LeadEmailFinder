info:
  name: 04-initialize-with-denied-origin
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Origin
      value: "{{deniedOrigin}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-06-18",
          "capabilities": {},
          "clientInfo": { "name": "bruno", "version": "0.0.0" }
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('a denied origin is rejected before MCP dispatch', function() {
          expect(res.status).to.equal(403);
          expect(res.body).to.eql({ error: 'origin_not_allowed' });
        });
