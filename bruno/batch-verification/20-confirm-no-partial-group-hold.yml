info:
    name: 20-confirm-no-partial-group-hold
    type: http
    seq: 20

http:
    method: PUT
    url: '{{baseUrl}}/credits/{{organizationId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{platformToken}}'
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {"amount": 0}

runtime:
    scripts:
        - type: before-request
          code: |-
              const response = await fetch(`${bru.getEnvVar('baseUrl')}/credits/${bru.getEnvVar('organizationId')}`, {
                headers: { Authorization: `Bearer ${bru.getVar('platformToken')}` },
              });
              const payload = await response.json();
              if (!response.ok) throw new Error('Balance read failed');
              bru.setVar('balanceAfterDeniedGroup', payload.balance);
        - type: tests
          code: |-
              test('leaves the balance untouched and no credit held by the denied group', function() {
                expect(bru.getVar('balanceAfterDeniedGroup')).to.equal(1);
                // Setting a balance below held credits returns 409, so success proves nothing remains reserved.
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(0);
              });
