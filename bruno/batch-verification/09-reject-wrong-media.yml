info:
    name: 09-reject-wrong-media
    type: http
    seq: 9

http:
    method: POST
    url: '{{baseUrl}}/verifyBatch/csv'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'
    body:
        type: multipart-form
        data:
            - name: file
              type: file
              value:
                  - ./fixtures/not-csv.txt

runtime:
    scripts:
        - type: tests
          code: |-
              test('rejects a non-CSV upload before queueing', function() { expect(res.status).to.equal(422); });
