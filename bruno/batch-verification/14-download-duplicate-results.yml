info:
    name: 14-download-duplicate-results
    type: http
    seq: 14

http:
    method: GET
    url: '{{baseUrl}}/verifyBatch/{{duplicateBatchJobId}}/results'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              const { parse } = require('csv-parse/sync');
              const rows = parse(res.body, { columns: true, skip_empty_lines: true });
              const address = bru.getEnvVar('duplicateAddress');

              test('preserves input row order and case with one shared result UUID', function() {
                expect(res.status).to.equal(200);
                expect(res.headers['content-type']).to.include('text/csv');
                expect(res.headers['content-disposition']).to.equal(`attachment; filename="batch-verification-${bru.getVar('duplicateBatchJobId')}.csv"`);
                expect(rows.map((row) => row.email)).to.deep.equal([address.replace('batch-', 'Batch-'), address, address.toUpperCase()]);
                expect(rows.map((row) => row.sourceRow)).to.deep.equal(['1', '2', '3']);
                expect(rows.map((row) => row.duplicateOfRow)).to.deep.equal(['', '1', '1']);
                expect(rows[0].id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
                expect(new Set(rows.map((row) => row.id)).size).to.equal(1);
                for (const row of rows) {
                  expect(row.normalizedEmail).to.equal(address);
                  expect(row.verificationStatus).to.equal('completed');
                  expect(row.verificationQuality).to.equal('conclusive_positive');
                  expect(row.reason).to.equal('accepted_email');
                }
              });

              test('attributes the actual charge to the first row and keeps duplicates free', function() {
                expect(rows.map((row) => row.creditsCharged)).to.deep.equal(['1', '0', '0']);
                expect(rows.map((row) => row.billingReason)).to.deep.equal(['conclusive', 'duplicate', 'duplicate']);
                const charged = rows.reduce((sum, row) => sum + Number(row.creditsCharged), 0);
                expect(charged).to.equal(bru.getVar('duplicateBatchCharged'));
              });
