info:
    name: 03-download-batch-results
    type: http
    seq: 3

http:
    method: GET
    url: '{{baseUrl}}/verifyBatch/{{batchJobId}}/results'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('downloads the completed batch as CSV', function() {
                expect(res.status).to.equal(200);
                expect(res.headers['content-type']).to.contain('text/csv');
                expect(res.body).to.be.a('string');
                expect(res.body).to.contain('email');
                expect(res.body).to.contain('person@lef.test');
                expect(res.body).to.contain('other@lef.test');
              });
