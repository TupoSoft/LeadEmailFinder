info:
  name: 03-download-batch-results
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/verifyBatch/{{batchJobId}}/results"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const maxAttempts = 30;
        const delayMs = 1000;
        const statusUrl = `${bru.getEnvVar('baseUrl')}/verifyBatch/${bru.getVar('batchJobId')}`;

        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const response = await fetch(statusUrl, {
            headers: { Authorization: `Bearer ${bru.getVar('serviceClientToken')}` },
          });
          const payload = await response.json();

          if (payload.status === 'completed') {
            break;
          }

          if (payload.status === 'failed') {
            throw new Error(`Batch job ${bru.getVar('batchJobId')} failed instead of completing.`);
          }

          if (attempt === maxAttempts - 1) {
            throw new Error(`Batch job ${bru.getVar('batchJobId')} did not complete within ${maxAttempts * delayMs}ms.`);
          }

          await new Promise((resolve) => setTimeout(resolve, delayMs));
        }
    - type: tests
      code: |-
        test('downloads the completed batch results as CSV', function() {
          expect(res.status).to.equal(200);
          expect(res.headers['content-type']).to.include('text/csv');
        });

        test('CSV rows match the uploaded fixture email addresses', function() {
          const lines = res.body.trim().split('\n').filter((line) => line.length > 0);
          const header = lines[0].split(',');
          const emailIndex = header.indexOf('email');
          const idIndex = header.indexOf('id');
          expect(idIndex).to.be.at.least(0);
          for (const line of lines.slice(1)) {
            const id = line.split(',')[idIndex];
            expect(id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          }

          expect(emailIndex).to.be.at.least(0);

          const emails = lines.slice(1).map((line) => line.split(',')[emailIndex]).sort();
          expect(emails).to.deep.equal(['other@lef.test', 'person@lef.test']);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
