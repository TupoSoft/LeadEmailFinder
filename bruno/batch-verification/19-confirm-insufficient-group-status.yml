info:
    name: 19-confirm-insufficient-group-status
    type: http
    seq: 19

http:
    method: GET
    url: '{{baseUrl}}/verifyBatch/{{insufficientGroupJobId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              const statusUrl = `${bru.getEnvVar('baseUrl')}/verifyBatch/${bru.getVar('insufficientGroupJobId')}`;
              for (let attempt = 0; attempt < 90; attempt++) {
                const response = await fetch(statusUrl, {
                  headers: { Authorization: `Bearer ${bru.getVar('serviceClientToken')}` },
                });
                const payload = await response.json();
                if (!response.ok || !['queued', 'running', 'completed'].includes(payload.status)) {
                  throw new Error('Insufficient-credit batch did not satisfy the completion contract');
                }
                if (payload.status === 'completed' && payload.billing?.state === 'settled') break;
                if (attempt === 89) throw new Error('Insufficient-credit batch did not settle within the bounded wait');
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
        - type: tests
          code: |-
              test('completes with every address failed for insufficient group funds', function() {
                expect(res.status).to.equal(200);
                expect(res.body.status).to.equal('completed');
                expect(res.body.resultsAvailable).to.equal(true);
                expect(res.body.counts).to.deep.equal({
                  totalRows: 2, uniqueAddresses: 2, duplicateRows: 0,
                  cachedAddresses: 0, sharedAddresses: 0, cooldownAddresses: 0,
                  completedAddresses: 2, conclusiveAddresses: 0,
                  inconclusiveAddresses: 0, failedAddresses: 2,
                });
              });

              test('reserves and charges nothing for the denied group', function() {
                expect(res.body.billing).to.deep.equal({ state: 'settled', reserved: 0, charged: 0 });
              });
