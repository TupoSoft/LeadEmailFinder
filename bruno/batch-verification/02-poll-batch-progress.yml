info:
  name: 02-poll-batch-progress
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/verifyBatch/{{batchJobId}}"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('reports bounded progress at every observed poll and reaches exactly 100 on completion', async function() {
          const maxAttempts = 30;
          const delayMs = 1000;
          let body = res.body;

          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            expect(body.progress).to.be.a('number');
            expect(Number.isFinite(body.progress)).to.equal(true);
            expect(body.progress).to.be.at.least(0);
            expect(body.progress).to.be.at.most(100);

            if (body.status === 'completed') {
              expect(body.progress).to.equal(100);
              return;
            }

            await new Promise((resolve) => setTimeout(resolve, delayMs));

            const poll = await fetch(`${bru.getEnvVar('baseUrl')}/verifyBatch/${bru.getVar('batchJobId')}`, {
              headers: { Authorization: `Bearer ${bru.getVar('serviceClientToken')}` },
            });
            body = await poll.json();
          }

          throw new Error(`Batch job did not complete within ${maxAttempts} polls`);
        });
