info:
    name: 04-upload-invalid-csv
    type: http
    seq: 4

http:
    method: POST
    url: '{{baseUrl}}/verifyBatch/csv'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'
    body:
        type: multipart-form
        data:
            - name: file
              type: file
              value:
                  - ./fixtures/invalid.csv

runtime:
    scripts:
        - type: tests
          code: |-
              test('queues content validation without exposing input', function() {
                expect(res.status).to.equal(202);
                expect(Object.keys(res.body)).to.deep.equal(['id']);
                bru.setVar('invalidBatchJobId', res.body.id);
              });
