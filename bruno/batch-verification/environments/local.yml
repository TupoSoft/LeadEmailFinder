name: local
variables:
    - name: baseUrl
      value: http://localhost:53000
    - name: oidcIssuerUrl
      value: '{{process.env.OIDC_ISSUER_URL}}'
    - name: serviceClientId
      value: '{{process.env.CUSTOMER_SERVICE_CLIENT_ID}}'
    - name: serviceClientSecret
      value: '{{process.env.CUSTOMER_SERVICE_CLIENT_SECRET}}'
