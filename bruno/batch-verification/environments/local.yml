name: local
variables:
    - name: baseUrl
      value: http://localhost:53000
    - name: oidcIssuerUrl
      value: '{{process.env.OIDC_ISSUER_URL}}'
    - name: organizationId
      value: '{{process.env.CUSTOMER_ORGANIZATION_ID}}'
    - name: evidenceControlUrl
      value: '{{process.env.EVIDENCE_CONTROL_URL}}'
    - name: duplicateAddress
      value: '{{process.env.BATCH_DUPLICATE_ADDRESS}}'
    - name: duplicateCsvPath
      value: '{{process.env.BATCH_DUPLICATE_CSV_PATH}}'
    - name: insufficientGroupCsvPath
      value: '{{process.env.BATCH_INSUFFICIENT_GROUP_CSV_PATH}}'
    - name: platformApiKey
      value: '{{process.env.PLATFORM_API_KEY}}'
    - name: customerApiKey
      value: '{{process.env.CUSTOMER_API_KEY}}'
