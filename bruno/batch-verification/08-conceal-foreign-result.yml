        - type: before-request
          code: |-
              req.setHeader('Authorization', `Bearer ${bru.getProcessEnv('PLATFORM_API_KEY')}`);
        - type: tests
          code: |-
              test('conceals foreign results', function() { expect(res.status).to.equal(404); });
