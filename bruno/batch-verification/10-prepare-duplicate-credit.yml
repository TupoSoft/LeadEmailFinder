info:
    name: 10-prepare-duplicate-credit
    type: http
    seq: 10

http:
    method: PUT
    url: '{{baseUrl}}/credits/{{organizationId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{platformToken}}'
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {"amount": 1}

runtime:
    scripts:
        - type: before-request
          code: |-
              req.setHeader('Authorization', `Bearer ${bru.getProcessEnv('PLATFORM_API_KEY')}`);
              bru.setVar('platformToken', bru.getProcessEnv('PLATFORM_API_KEY'));
        - type: tests
          code: |-
              test('prepares one credit for one fresh unique address', function() {
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(1);
              });
