info:
  name: 01-upload-csv
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/verifyBatch/csv"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ./fixtures/sample.csv

runtime:
  scripts:
    - type: tests
      code: |-
        test('enqueues a batch verification job', function() {
          expect(res.status).to.equal(202);
          expect(res.body.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(Object.keys(res.body)).to.deep.equal(['id']);
          bru.setVar('batchJobId', res.body.id);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
