info:
  name: 04-accept-invitation-duplicate-is-idempotent
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/invitations/{{invitationToken}}/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "{{acceptancePassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('resubmitting the token is a no-op with only a generic status', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(201);
          expect(res.body).to.deep.equal({ status: 'accepted' });
        });
