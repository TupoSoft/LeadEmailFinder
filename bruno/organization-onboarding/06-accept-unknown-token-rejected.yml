info:
  name: 06-accept-unknown-token-rejected
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/invitations/{{unknownInvitationToken}}/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "{{acceptancePassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an unknown invitation token', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(404);
        });
