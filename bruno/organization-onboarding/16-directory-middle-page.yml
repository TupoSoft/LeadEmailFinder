info:
  name: 16-directory-middle-page
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/v1/organizations?pageSize=1&pageToken={{directoryPageToken}}"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('middle page advances without repeating a row', function() {
          expect(res.status).to.equal(200);
          expect(res.body.organizations).to.have.length(1);
          const ids = bru.getVar('directorySeenIds');
          const row = res.body.organizations[0];
          expect(row).to.have.all.keys('id', 'name', 'createdAt', 'updatedAt');
          expect(ids).not.to.include(row.id);
          expect(res.body.nextPageToken).to.be.a('string').and.not.empty;
          bru.setVar('directorySeenIds', [...ids, row.id]);
          bru.setVar('directoryPageToken', res.body.nextPageToken);
        });
