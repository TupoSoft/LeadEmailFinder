opencollection: 1.0.0

info:
  name: Organization Onboarding

request:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('acceptancePassword')) {
          const crypto = require('node:crypto');
          bru.setVar('acceptancePassword', crypto.randomBytes(24).toString('base64url'));
          bru.setVar('unknownInvitationToken', crypto.randomBytes(32).toString('base64url'));
        }
        bru.setVar('serviceClientToken', bru.getEnvVar('platformApiKey'));
        bru.setVar('customerServiceClientToken', bru.getEnvVar('customerApiKey'));
