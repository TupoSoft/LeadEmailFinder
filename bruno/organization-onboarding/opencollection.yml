opencollection: 1.0.0

info:
  name: Organization Onboarding

request:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('acceptancePassword')) {
          const crypto = require('node:crypto');
          bru.setVar('acceptancePassword', crypto.randomBytes(24).toString('base64url'));
          bru.setVar('unknownInvitationToken', crypto.randomBytes(32).toString('base64url'));
        }
        if (!bru.getVar('serviceClientToken')) {
          const response = await fetch(`${bru.getEnvVar('oidcIssuerUrl')}/protocol/openid-connect/token`, {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'client_credentials',
              client_id: bru.getEnvVar('serviceClientId'),
              client_secret: bru.getEnvVar('serviceClientSecret'),
            }),
          });
          const payload = await response.json();
          if (!response.ok || !payload.access_token) {
            throw new Error(`Client Credentials token request failed with HTTP ${response.status}`);
          }
          bru.setVar('serviceClientToken', payload.access_token);
        }
        if (!bru.getVar('customerServiceClientToken')) {
          const response = await fetch(`${bru.getEnvVar('oidcIssuerUrl')}/protocol/openid-connect/token`, {
            method: 'POST',
            body: new URLSearchParams({
              grant_type: 'client_credentials',
              client_id: bru.getEnvVar('customerServiceClientId'),
              client_secret: bru.getEnvVar('customerServiceClientSecret'),
            }),
          });
          const payload = await response.json();
          if (!response.ok || !payload.access_token) throw new Error('Customer fixture authentication failed');
          bru.setVar('customerServiceClientToken', payload.access_token);
        }
