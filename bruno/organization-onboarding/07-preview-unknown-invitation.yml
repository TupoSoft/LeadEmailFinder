info:
  name: 07-preview-unknown-invitation
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/v1/organizations/invitations/{{unknownInvitationToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('invitation preview enforces pending authority and secret response headers', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(404);
          for (const field of ['organizationName', 'organizationId', 'email', 'role', 'expiresAt', 'membershipId', 'token', 'tokenHash']) {
            expect(res.body).not.to.have.property(field);
          }
        });
