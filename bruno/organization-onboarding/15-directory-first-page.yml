info:
  name: 15-directory-first-page
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/v1/organizations?pageSize=1"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('first page contains metadata and a continuation, without a total or secrets', function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.have.all.keys('organizations', 'nextPageToken');
          expect(res.body.organizations).to.have.length(1);
          const row = res.body.organizations[0];
          expect(row).to.have.all.keys('id', 'name', 'createdAt', 'updatedAt');
          expect(res.body.nextPageToken).to.be.a('string').and.not.empty;
          bru.setVar('directorySeenIds', [row.id]);
          bru.setVar('directoryPageToken', res.body.nextPageToken);
        });
