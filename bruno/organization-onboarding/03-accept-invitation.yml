info:
  name: 03-accept-invitation
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/invitations/{{invitationToken}}/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "{{acceptancePassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('accepts the invitation without an existing session', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(201);
          expect(res.body.organizationId).to.equal(bru.getVar('organizationId'));
          expect(res.body.role).to.equal('owner');
        });
