info:
  name: 06-existing-owner-conflict-preserves-account
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/invitations/{{conflictingInvitationToken}}/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "{{acceptancePassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an invitation when the existing identity already has an active membership', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(409);
        });
