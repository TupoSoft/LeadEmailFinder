info:
  name: 01-create-organization-unauthorized-rejected
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test Org",
        "ownerEmail": "owner@example.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects organization creation without a credential', function() {
          expect(res.status).to.equal(401);
        });
