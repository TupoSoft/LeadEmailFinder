info:
  name: 05-issue-invitation-requires-org-membership
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "email": "second-member@example.test",
        "role": "member"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an actor whose organization does not match the target organization', function() {
          expect(res.status).to.equal(403);
        });
