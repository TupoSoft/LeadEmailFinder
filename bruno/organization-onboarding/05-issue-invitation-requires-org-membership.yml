info:
  name: 05-issue-invitation-requires-org-membership
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "second-member@example.test",
        "role": "member"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an actor whose organization does not match the target organization', function() {
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
          expect(res.status).to.equal(403);
        });
