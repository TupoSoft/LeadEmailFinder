info:
  name: 18-read-owned-verification
  type: http
  seq: 18

http:
  method: GET
  url: '{{baseUrl}}/verifications/{{verificationId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'

runtime:
  scripts:
    - type: tests
      code: |-
        test('reads the persisted result owned by the authenticated organization', function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('verificationId'));
          expect(res.body.email).to.equal('person@lef.test');
          expect(res.body.reason).to.equal('accepted_email');
          expect(res.body).not.to.have.property('organizationId');
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
