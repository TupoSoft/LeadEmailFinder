info:
  name: 13-post-verify-consumes-credit
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "sync-credit-check@lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('verifies the local address through the POST route and releases its reservation', function() {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.body.email).to.equal('sync-credit-check@lef.test');
          expect(res.body.catchAll).to.equal(true);
          expect(res.body.reason).to.equal('accepted_email');
          expect(res.body.targetExchange).to.equal('smtp.lef.test');
          expect(res.body.sources).to.deep.equal([]);
          // This fixture domain accepts every recipient, including the catch-all control probe (catchAll: true
          // above), so this is always classified inconclusive: the reservation from request 10 is released, not
          // captured, and no cache-eligible result is produced.
          expect(res.body.operation.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.body.operation.source).to.equal('fresh');
          expect(res.body.operation.observedAt).to.equal(null);
          expect(res.body.operation.cacheExpiresAt).to.equal(null);
          expect(res.body.operation.billing).to.deep.equal({ state: 'settled', reserved: 1, charged: 0, reason: 'inconclusive' });
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
