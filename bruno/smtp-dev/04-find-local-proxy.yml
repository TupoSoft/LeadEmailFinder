info:
  name: 04-find-local-proxy
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies?pageSize=100"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('finds the local development proxy', function() {
          expect(res.status).to.equal(200);
          const proxy = res.body.proxies.find(p => p.host === 'smtp-dev-proxy.lef.test');
          expect(proxy).to.exist;
          bru.setVar('proxyId', proxy.id);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
