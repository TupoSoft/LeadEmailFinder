info:
  name: 13-update-owned-email
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{baseUrl}}/emails/person@lef.test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "exists": false
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('updates the authenticated organization email cache', function() {
          expect(res.status).to.equal(200);
          expect(res.body.email).to.equal('person@lef.test');
          expect(res.body.exists).to.equal(false);
          expect(res.body).not.to.have.property('organizationId');
        });
