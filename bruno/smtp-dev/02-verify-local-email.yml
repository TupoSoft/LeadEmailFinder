info:
  name: 02-verify-local-email
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "email": "person@lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('verifies the local address through the registered SOCKS5 proxy', function() {
          expect(res.status).to.equal(201);
          expect(res.body.email).to.equal('person@lef.test');
          expect(res.body.catchAll).to.equal(true);
          expect(res.body.reason).to.equal('accepted_email');
          expect(res.body.targetExchange).to.equal('smtp.lef.test');
        });
