info:
  name: 06-restore-local-proxy
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/v1/proxies/{{proxyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "state": "active"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('restores the local development proxy for future runs', function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('proxyId'));
          expect(res.body.state).to.equal('active');
        });
