info:
  name: 29-async-enqueue-requires-credit
  type: http
  seq: 29

http:
  method: POST
  url: '{{baseUrl}}/verifyAsync'
  headers:
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "email": "async-credit-check-zero@lef.test" }

runtime:
  scripts:
    - type: before-request
      code: |-
        // Request 25 left one credit available (the prior inconclusive completion released its reservation), so
        // this genuinely zero-balance check must reset it explicitly first.
        const response = await fetch(`${bru.getEnvVar('baseUrl')}/credits/${bru.getEnvVar('organizationId')}`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${bru.getVar('serviceClientToken')}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: 0 }),
        });
        if (!response.ok) throw new Error('Fixture balance reset failed');
    - type: tests
      code: |-
        test('rejects asynchronous enqueue with 402 at zero balance', function() {
          expect(res.status).to.equal(402);
          expect(res.body).not.to.have.property('id');
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
        });
