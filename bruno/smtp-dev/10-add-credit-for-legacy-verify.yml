info:
  name: 10-add-credit-for-legacy-verify
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "amount": 1
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('adds one credit for the legacy verification request', function() {
          expect(res.status).to.equal(201);
          expect(res.body.balance).to.equal(1);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
