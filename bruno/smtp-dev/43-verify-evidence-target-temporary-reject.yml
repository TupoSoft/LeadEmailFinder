info:
  name: 43-verify-evidence-target-temporary-reject
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "evidence-temporary-reject@evidence.lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('falls back to a durable handle rather than blocking for the full greylist retry', function() {
          // A temporary 450 schedules a retry (durable, generation-fenced, matching the async worker's own
          // greylist backoff) instead of settling immediately. The first backoff is 60 seconds, which does not
          // fit the synchronous route's 30-second budget, so this durably admitted operation falls back to the
          // same 202 handle the async route would return; it is never treated as a conclusive negative. Its
          // reservation stays pending until the reconciler's own retry cadence eventually resolves it — see
          // request 46's balance check.
          expect(res.status).to.equal(202);
          expect(Object.keys(res.body)).to.deep.equal(['id']);
        });
