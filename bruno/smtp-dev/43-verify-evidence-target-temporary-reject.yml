info:
  name: 43-verify-evidence-target-temporary-reject
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "evidence-temporary-reject@evidence.lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('treats a temporary 450 as ineligible, not a conclusive negative', function() {
          expect(res.status).to.equal(201);
          expect(res.body.email).to.equal('evidence-temporary-reject@evidence.lef.test');
          expect(res.body.exists).to.equal(null);
          expect(res.body.catchAll).to.equal(false);
          expect(res.body.reason).to.equal('temporarily_blocked');
        });
