info:
  name: 08-zero-balance-for-legacy-verify
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "amount": 0
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('resets the balance to zero so the legacy 402 check is deterministic', function() {
          expect(res.status).to.equal(200);
          expect(res.body.balance).to.equal(0);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
