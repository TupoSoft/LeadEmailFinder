info:
  name: 11-legacy-verify-consumes-credit
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/verify?email=person@lef.test"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('verifies the local address through the deprecated legacy route and debits a credit', function() {
          expect(res.status).to.equal(200);
          expect(res.body.email).to.equal('person@lef.test');
          expect(res.body.catchAll).to.equal('enabled');
          expect(res.body.reason).to.equal('accepted_email');
          expect(res.body.targetExchange).to.equal('smtp.lef.test');
        });
