info:
  name: 46-evidence-scenarios-consumed-exactly-seven-credits
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('debits exactly one credit for each of the three conclusive evidence-classification verifications', function() {
          // classifyVerificationQuality only recognizes two conclusive shapes: the target's own exact
          // missing-recipient proof (target_missing, request 35), or an accepted target together with a
          // conclusively missing control (target_accepted and close_after_accept, requests 33 and 45). Every
          // other rejection shape — a bare 550 (request 39), an ambiguous 5.7.1 (request 41), and a MAIL-FROM
          // rejection (sender_rejected, request 37) — cannot distinguish "mailbox absent" from a policy or
          // transport artifact, so the domain policy classifies all three inconclusive; their reservations are
          // released, not captured. The seventh scenario (request 43, a temporary 450) falls back to a durable
          // handle within its own synchronous budget and is still awaiting its greylist retry at this point in
          // the run, so its reservation stays pending rather than captured or released. Only three of the seven
          // prepared credits are spent so far.
          expect(res.status).to.equal(200);
          expect(res.body.balance).to.equal(4);
        });
