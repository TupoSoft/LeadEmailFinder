info:
  name: 01-add-verification-credits
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Idempotency-Key
      value: "{{smtpVerificationCreditKey}}"
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "amount": 2
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // One UUID belongs to this logical add; any explicit retry must reuse it.
        if (!bru.getVar('smtpVerificationCreditKey')) {
          bru.setVar('smtpVerificationCreditKey', require('node:crypto').randomUUID());
        }
    - type: tests
      code: |-
        test('adds two verification credits to the bootstrap-seeded platform organization', function() {
          expect(res.status).to.equal(201);
          expect(res.body.balance).to.be.a('number');
          expect(res.body.balance).to.be.at.least(2);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
