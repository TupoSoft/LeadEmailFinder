info:
  name: 16-reject-missing-email-update
  type: http
  seq: 16

http:
  method: PATCH
  url: "{{baseUrl}}/emails/missing@lef.test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "exists": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('conceals an email outside the authenticated organization as not found', function() {
          expect(res.status).to.equal(404);
          expect(res.body.message).to.equal('Email not found.');
          expect(JSON.stringify(res.body)).not.to.include('missing@lef.test');
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
