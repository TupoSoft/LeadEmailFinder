info:
  name: 30-async-rejections-preserve-zero-balance
  type: http
  seq: 30

http:
  method: GET
  url: '{{baseUrl}}/credits/{{organizationId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'

runtime:
  scripts:
    - type: tests
      code: |-
        test('async rejection paths preserve the zero balance', function() {
          expect(res.status).to.equal(200);
          expect(res.body.balance).to.equal(0);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
        });
