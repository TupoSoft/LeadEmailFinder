info:
  name: 24-conceal-missing-async-job
  type: http
  seq: 24

http:
  method: GET
  url: '{{baseUrl}}/verifyAsync/{{missingAsyncJobId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('missingAsyncJobId', require('node:crypto').randomUUID());
    - type: tests
      code: |-
        test('conceals a missing asynchronous job without requiring credits', function() {
          expect(res.status).to.equal(404);
          expect(res.body.message).to.equal(`Job with id "${bru.getVar('missingAsyncJobId')}" not found.`);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
        });
