info:
  name: 03-find-local-proxy
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies?pageSize=100"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('finds the local development proxy', function() {
          expect(res.status).to.equal(200);
          const proxy = res.body.proxies.find(p => p.host === 'smtp-dev-proxy.lef.test');
          expect(proxy).to.exist;
          bru.setVar('proxyId', proxy.id);
        });
