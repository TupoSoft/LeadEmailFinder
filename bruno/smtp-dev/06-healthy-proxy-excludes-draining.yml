info:
  name: 06-healthy-proxy-excludes-draining
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies/healthy?mxHost=smtp.lef.test"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('finds no healthy proxy for the MX host while the only proxy is draining', function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.not.be.ok;
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
