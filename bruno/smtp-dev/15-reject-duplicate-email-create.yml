info:
  name: 15-reject-duplicate-email-create
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/emails"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "person@lef.test",
        "exists": false
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects a duplicate cache record without echoing its address', function() {
          expect(res.status).to.equal(409);
          expect(res.body.message).to.equal('Email already exists.');
          expect(JSON.stringify(res.body)).not.to.include('person@lef.test');
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
