info:
  name: 09-legacy-verify-requires-credit
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/verify?email=person@lef.test"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects the deprecated legacy verification route with 402 at zero balance', function() {
          expect(res.status).to.equal(402);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
