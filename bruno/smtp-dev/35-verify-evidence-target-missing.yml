info:
  name: 35-verify-evidence-target-missing
  type: http
  seq: 35

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "evidence-missing@evidence.lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects the target with its own exact 5.1.1 missing-recipient proof', function() {
          expect(res.status).to.equal(201);
          expect(res.body.email).to.equal('evidence-missing@evidence.lef.test');
          expect(res.body.exists).to.equal(false);
          expect(res.body.catchAll).to.equal(false);
          expect(res.body.reason).to.equal('rejected_email');
        });
