info:
  name: 04-drain-local-proxy
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/v1/proxies/{{proxyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "state": "draining"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('drains the local development proxy', function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('proxyId'));
          expect(res.body.state).to.equal('draining');
        });
