info:
  name: 37-verify-evidence-sender-rejected
  type: http
  seq: 37

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "evidence-sender-rejected@evidence.lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('never treats a MAIL FROM rejection as recipient proof', function() {
          expect(res.status).to.equal(201);
          expect(res.body.email).to.equal('evidence-sender-rejected@evidence.lef.test');
          expect(res.body.exists).to.equal(null);
          // The fixed control address was already cached as conclusively missing by an earlier scenario in
          // this same run, so its fresh, valid evidence is correctly reused here rather than re-probed live;
          // this scenario exercises the target's own MAIL FROM rejection instead.
          expect(res.body.catchAll).to.equal(false);
          expect(res.body.reason).to.equal('unexpected_error');
        });
