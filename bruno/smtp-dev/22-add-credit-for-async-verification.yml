info:
  name: 22-add-credit-for-async-verification
  type: http
  seq: 22

http:
  method: POST
  url: '{{baseUrl}}/credits/{{organizationId}}'
  headers:
    - name: Idempotency-Key
      value: "{{smtpAsyncCreditKey}}"
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "amount": 1 }

runtime:
  scripts:
    - type: before-request
      code: |-
        // One UUID belongs to this logical add; any explicit retry must reuse it.
        if (!bru.getVar('smtpAsyncCreditKey')) {
          bru.setVar('smtpAsyncCreditKey', require('node:crypto').randomUUID());
        }
    - type: tests
      code: |-
        test('adds a credit for asynchronous verification', function() {
          // Request 13's inconclusive result released its own reservation, leaving one credit already available
          // before this adds a second.
          expect(res.status).to.equal(201);
          expect(res.body.balance).to.equal(2);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
