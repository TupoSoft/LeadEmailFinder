info:
  name: 17-conceal-missing-verification
  type: http
  seq: 17

http:
  method: GET
  url: '{{baseUrl}}/verifications/{{missingVerificationId}}'
  headers:
    - name: Authorization
      value: 'Bearer {{serviceClientToken}}'

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('missingVerificationId', require('node:crypto').randomUUID());
    - type: tests
      code: |-
        test('conceals a missing verification result', function() {
          expect(res.status).to.equal(404);
          expect(res.body.message).to.equal('Verification result not found');
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
