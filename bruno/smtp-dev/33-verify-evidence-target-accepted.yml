info:
  name: 33-verify-evidence-target-accepted
  type: http
  seq: 33

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: X-Request-ID
      value: caller-controlled-correlation
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "evidence-accepted@evidence.lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('accepts the target after a conclusively missing control', function() {
          expect(res.status).to.equal(201);
          expect(res.body.email).to.equal('evidence-accepted@evidence.lef.test');
          expect(res.body.exists).to.equal(true);
          expect(res.body.catchAll).to.equal(false);
          expect(res.body.reason).to.equal('accepted_email');
        });
