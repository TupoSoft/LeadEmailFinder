info:
  name: 09-post-verify-requires-credit
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "email": "sync-credit-check@lef.test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects the POST verification route with 402 at zero balance', function() {
          expect(res.status).to.equal(402);
        });

        test('returns a server-generated request UUID', function() {
          expect(res.headers['x-request-id']).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          expect(res.headers['x-request-id']).not.to.equal('caller-controlled-correlation');
        });
