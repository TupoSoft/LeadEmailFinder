info:
    name: signout-without-session
    type: http
    seq: 5
http:
    method: POST
    url: '{{baseUrl}}/v1/auth/sign-out'
    headers:
        - name: Origin
          value: '{{appOrigin}}'
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: '{}'
runtime:
    scripts:
        - type: tests
          code: |-
              test('repeating sign-out is safe and expires browser cookies', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ success: true });
                expect(JSON.stringify(res.headers['set-cookie'])).to.contain('Max-Age=0');
              });
