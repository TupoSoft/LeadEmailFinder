info:
    name: signout-requires-json
    type: http
    seq: 3
http:
    method: POST
    url: '{{baseUrl}}/v1/auth/sign-out'
    headers:
        - name: Origin
          value: '{{appOrigin}}'
        - name: Content-Type
          value: text/plain
    body:
        type: text
        data: '{}'
runtime:
    scripts:
        - type: tests
          code: |-
              test('rejects simple cross-site form content types', function() {
                expect(res.status).to.equal(415);
                expect(res.body).to.deep.equal({ code: 'json_required' });
              });
