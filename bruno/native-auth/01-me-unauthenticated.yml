info:
    name: me-unauthenticated
    type: http
    seq: 1
http:
    method: GET
    url: '{{baseUrl}}/v1/me'
runtime:
    scripts:
        - type: tests
          code: |-
              test('rejects missing authentication without exposing session data', function() {
                expect(res.status).to.equal(401);
                expect(res.body).to.deep.equal({ code: 'authentication_required' });
                expect(res.headers['cache-control']).to.equal('no-store');
              });
