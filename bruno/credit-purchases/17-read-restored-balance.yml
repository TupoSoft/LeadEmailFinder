info:
    name: 17-read-restored-balance
    type: http
    seq: 17

http:
    method: GET
    url: '{{baseUrl}}/credits/{{organizationId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('restores only the credits removed by the debit adjustment', function() {
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(Number(bru.getVar('paidBalance')));
                bru.setVar('restoredBalance', String(res.body.balance));
              });
