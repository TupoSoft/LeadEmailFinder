info:
    name: 18-replay-inverse-adjustment
    type: http
    seq: 18

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{restoreAdjustmentSignature}}'
    body:
        type: text
        data: '{{restoreAdjustmentBody}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('acknowledges a replayed inverse adjustment', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
