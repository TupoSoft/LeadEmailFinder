info:
    name: 13-read-debited-balance
    type: http
    seq: 13

http:
    method: GET
    url: '{{baseUrl}}/v1/billing/summary'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('claws back exactly the credits granted by the purchase', function() {
                expect(res.status).to.equal(200);
                const expected = Number(bru.getVar('paidBalance')) - Number(bru.getEnvVar('expectedCredits'));
                expect(res.body.balance).to.equal(expected);
                bru.setVar('debitedBalance', String(res.body.balance));
              });
