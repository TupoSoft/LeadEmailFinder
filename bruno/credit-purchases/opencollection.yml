opencollection: 1.0.0

info:
    name: Credit Purchases

request:
    scripts:
        - type: before-request
          code: |-
              bru.setVar('serviceClientToken', bru.getEnvVar('platformApiKey'));
              if (
                !req.getName().includes('unauthorized') &&
                !req.getName().includes('active-hold') &&
                !req.getUrl().includes('/v1/payments/webhook')
              ) {
                req.setHeader('Authorization', `Bearer ${bru.getVar('serviceClientToken')}`);
              }
