info:
    name: 06-deliver-paid-webhook
    type: http
    seq: 6

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{paidWebhookSignature}}'
    body:
        type: text
        data: '{{paidWebhookBody}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              const CryptoJS = require('crypto-js');
              const payload = JSON.stringify({
                kind: 'purchase_paid',
                providerEventId: `stub-paid-${bru.getVar('purchaseId')}`,
                providerReference: bru.getVar('providerReference'),
                purchaseId: bru.getVar('purchaseId'),
                claimedCredits: 999999,
              });
              const signature = CryptoJS.HmacSHA256(payload, bru.getEnvVar('webhookSecret')).toString(CryptoJS.enc.Hex);
              bru.setVar('paidWebhookBody', payload);
              bru.setVar('paidWebhookSignature', signature);
        - type: tests
          code: |-
              test('accepts a signed paid webhook without OIDC credentials', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
