info:
    name: 21-reject-signed-adjustment-without-scope
    type: http
    seq: 21

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{invalidAdjustmentSignature}}'
    body:
        type: text
        data: '{{invalidAdjustmentBody}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              const CryptoJS = require('crypto-js');
              const payload = JSON.stringify({
                kind: 'purchase_adjustment_debit',
                providerEventId: `stub-invalid-adjustment-${bru.getVar('purchaseId')}`,
                providerReference: bru.getVar('providerReference'),
                providerAdjustmentId: `stub-invalid-adjustment-${bru.getVar('purchaseId')}`,
                amountMinor: Number(bru.getEnvVar('expectedProviderTotalMinor')),
                currency: bru.getEnvVar('expectedCurrency'),
              });
              const signature = CryptoJS.HmacSHA256(payload, bru.getEnvVar('webhookSecret')).toString(CryptoJS.enc.Hex);
              bru.setVar('invalidAdjustmentBody', payload);
              bru.setVar('invalidAdjustmentSignature', signature);
        - type: tests
          code: |-
              test('rejects a signed adjustment without its full-or-partial scope', function() {
                expect(res.status).to.equal(500);
              });
