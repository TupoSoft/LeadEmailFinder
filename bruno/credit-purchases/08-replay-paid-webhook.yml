info:
    name: 08-replay-paid-webhook
    type: http
    seq: 8

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{paidWebhookSignature}}'
    body:
        type: text
        data: '{{paidWebhookBody}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('acknowledges a replayed paid webhook', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
