name: local
variables:
    - name: baseUrl
      value: http://localhost:53000
    - name: oidcIssuerUrl
      value: '{{process.env.OIDC_ISSUER_URL}}'
    - name: organizationId
      value: '{{process.env.PLATFORM_ORGANIZATION_ID}}'
    - name: webhookSecret
      value: '{{process.env.PAYMENTS_STUB_WEBHOOK_SECRET}}'
    - name: packId
      value: starter
    - name: expectedCredits
      value: 100
    - name: expectedAmountMinor
      value: 500
    - name: expectedProviderTotalMinor
      value: 500
    - name: expectedCurrency
      value: USD
    - name: customerBillingToken
      value: '{{process.env.CUSTOMER_BILLING_TOKEN}}'
    - name: customerHeldBalance
      value: '{{process.env.CUSTOMER_HELD_BALANCE}}'
    - name: customerHeldReserved
      value: '{{process.env.CUSTOMER_HELD_RESERVED}}'
    - name: platformApiKey
      value: '{{process.env.PLATFORM_API_KEY}}'
