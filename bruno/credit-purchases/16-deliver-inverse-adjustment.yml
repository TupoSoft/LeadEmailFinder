info:
    name: 16-deliver-inverse-adjustment
    type: http
    seq: 16

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{restoreAdjustmentSignature}}'
    body:
        type: text
        data: '{{restoreAdjustmentBody}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              const CryptoJS = require('crypto-js');
              const payload = JSON.stringify({
                kind: 'purchase_adjustment_restore',
                providerEventId: `stub-restore-${bru.getVar('purchaseId')}`,
                providerReference: bru.getVar('providerReference'),
                providerAdjustmentId: `stub-adjustment-restore-${bru.getVar('purchaseId')}`,
                amountMinor: Number(bru.getEnvVar('expectedProviderTotalMinor')),
                isFull: true,
                currency: bru.getEnvVar('expectedCurrency'),
              });
              const signature = CryptoJS.HmacSHA256(payload, bru.getEnvVar('webhookSecret')).toString(CryptoJS.enc.Hex);
              bru.setVar('restoreAdjustmentBody', payload);
              bru.setVar('restoreAdjustmentSignature', signature);
        - type: tests
          code: |-
              test('accepts a signed inverse adjustment', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
