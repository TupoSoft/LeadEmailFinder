info:
    name: 10-reject-tampered-webhook
    type: http
    seq: 10

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{paidWebhookSignature}}'
    body:
        type: text
        data: '{{tamperedWebhookBody}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              bru.setVar('tamperedWebhookBody', bru.getVar('paidWebhookBody').replace('999999', '999998'));
        - type: tests
          code: |-
              test('rejects a body changed after it was signed', function() {
                expect(res.status).to.equal(400);
              });
