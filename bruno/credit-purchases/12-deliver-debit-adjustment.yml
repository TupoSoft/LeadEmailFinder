info:
    name: 12-deliver-debit-adjustment
    type: http
    seq: 12

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{debitAdjustmentSignature}}'
    body:
        type: text
        data: '{{debitAdjustmentBody}}'

runtime:
    scripts:
        - type: before-request
          code: |-
              const CryptoJS = require('crypto-js');
              const payload = JSON.stringify({
                kind: 'purchase_adjustment_debit',
                providerEventId: `stub-debit-${bru.getVar('purchaseId')}`,
                providerReference: bru.getVar('providerReference'),
                providerAdjustmentId: `stub-adjustment-debit-${bru.getVar('purchaseId')}`,
                amountMinor: Number(bru.getEnvVar('expectedAmountMinor')),
                currency: bru.getEnvVar('expectedCurrency'),
              });
              const signature = CryptoJS.HmacSHA256(payload, bru.getEnvVar('webhookSecret')).toString(CryptoJS.enc.Hex);
              bru.setVar('debitAdjustmentBody', payload);
              bru.setVar('debitAdjustmentSignature', signature);
        - type: tests
          code: |-
              test('accepts a signed debit adjustment', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
