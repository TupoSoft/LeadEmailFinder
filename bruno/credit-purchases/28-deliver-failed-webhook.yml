info:
    name: 28-deliver-failed-webhook
    type: http
    seq: 28

http:
    method: POST
    url: '{{baseUrl}}/v1/payments/webhook'
    headers:
        - name: Content-Type
          value: application/json
        - name: Paddle-Signature
          value: '{{failedWebhookSignature}}'
    body:
        type: text
        data: |-
            {{failedWebhookBody}}

runtime:
    scripts:
        - type: before-request
          code: |-
              const CryptoJS = require('crypto-js');
              const purchaseId = bru.getVar('failedPurchaseId');
              const payload = JSON.stringify({ kind: 'purchase_failed', providerEventId: `stub-failed-${purchaseId}`, providerReference: `stub_${purchaseId}`, purchaseId });
              bru.setVar('failedWebhookBody', payload);
              bru.setVar('failedWebhookSignature', CryptoJS.HmacSHA256(payload, bru.getEnvVar('webhookSecret')).toString(CryptoJS.enc.Hex));
        - type: tests
          code: |-
              test('accepts a signed failed event', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ received: true });
              });
