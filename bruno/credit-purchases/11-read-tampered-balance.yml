info:
    name: 11-read-tampered-balance
    type: http
    seq: 11

http:
    method: GET
    url: '{{baseUrl}}/credits/{{organizationId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('leaves the balance unchanged after rejecting a tampered webhook', function() {
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(Number(bru.getVar('paidBalance')));
              });
