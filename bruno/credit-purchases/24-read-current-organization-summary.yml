info:
    name: 24-read-current-organization-summary
    type: http
    seq: 24

http:
    method: GET
    url: '{{baseUrl}}/v1/billing/summary?organizationId=00000000-0000-4000-8000-000000000001'

runtime:
    scripts:
        - type: tests
          code: |-
              test('derives the organization from the principal rather than request input', function() {
                expect(res.status).to.equal(200);
                expect(Object.keys(res.body).sort()).to.deep.equal(['available', 'balance', 'reserved']);
                expect(res.body.balance).to.be.a('number');
                expect(res.body.reserved).to.be.a('number');
                expect(res.body.available).to.equal(res.body.balance - res.body.reserved);
              });
