info:
    name: 09-read-replayed-balance
    type: http
    seq: 9

http:
    method: GET
    url: '{{baseUrl}}/credits/{{organizationId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('leaves the balance unchanged after webhook replay', function() {
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(Number(bru.getVar('paidBalance')));
              });
