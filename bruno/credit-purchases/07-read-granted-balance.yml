info:
    name: 07-read-granted-balance
    type: http
    seq: 7

http:
    method: GET
    url: '{{baseUrl}}/v1/billing/summary'
    headers:
        - name: Authorization
          value: 'Bearer {{serviceClientToken}}'

runtime:
    scripts:
        - type: tests
          code: |-
              test('grants the purchase catalog credits rather than the event claim', function() {
                expect(res.status).to.equal(200);
                const expected = Number(bru.getVar('startingBalance')) + Number(bru.getEnvVar('expectedCredits'));
                expect(res.body.balance).to.equal(expected);
                bru.setVar('paidBalance', String(res.body.balance));
              });
