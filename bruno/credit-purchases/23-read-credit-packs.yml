info:
    name: 23-read-credit-packs
    type: http
    seq: 23

http:
    method: GET
    url: '{{baseUrl}}/v1/billing/credit-packs'

runtime:
    scripts:
        - type: tests
          code: |-
              test('returns only safe catalog fields in stable credit and ID order', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.be.an('array').that.is.not.empty;
                for (const pack of res.body) {
                  expect(Object.keys(pack).sort()).to.deep.equal(['amountMinor', 'credits', 'currency', 'id']);
                }
                const ordered = [...res.body].sort((left, right) => left.credits - right.credits || (left.id < right.id ? -1 : left.id > right.id ? 1 : 0));
                expect(res.body).to.deep.equal(ordered);
                const selected = res.body.find(pack => pack.id === bru.getEnvVar('packId'));
                expect(selected).to.deep.equal({ id: bru.getEnvVar('packId'), credits: Number(bru.getEnvVar('expectedCredits')), amountMinor: Number(bru.getEnvVar('expectedAmountMinor')), currency: bru.getEnvVar('expectedCurrency') });
              });
