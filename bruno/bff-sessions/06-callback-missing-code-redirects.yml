info:
  name: 06-callback-missing-code-redirects
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/auth/callback?state={{callbackState}}"
  headers:
    - name: Cookie
      value: "{{loginStateCookie}}"

settings:
  followRedirects: false

runtime:
  scripts:
    - type: tests
      code: |-
        test('consumes valid state and safely redirects a callback with no code', function() {
          expect(res.status).to.equal(302);
          expect(res.headers['location']).to.equal(
            bru.getEnvVar('baseUrl') + '/auth/error?code=authorization_code_exchange_failed'
          );
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');

          var setCookie = [].concat(res.headers['set-cookie'] || []);
          var clearedStateCookie = setCookie.find(function(cookie) {
            return cookie.indexOf('lef_login_state=;') === 0;
          });
          expect(clearedStateCookie).to.be.a('string');
          expect(clearedStateCookie).to.include('Path=/v1/auth');
          expect(clearedStateCookie).to.include('Expires=Thu, 01 Jan 1970 00:00:00 GMT');
          expect(clearedStateCookie).to.include('HttpOnly');
          expect(clearedStateCookie).to.include('SameSite=Lax');
          expect(clearedStateCookie).not.to.include('Max-Age');
        });
