info:
  name: 02-login-redirects-to-keycloak-with-pkce
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/auth/login?destination=%2Fapp%2Fverification"
  headers:
    - name: Cookie
      value: "lef_session=unusable-bruno-session; lef_csrf_token=old-bruno-csrf"

settings:
  followRedirects: false

runtime:
  scripts:
    - type: tests
      code: |-
        test('redirects to Keycloak with PKCE S256, state, and nonce', function() {
          expect(res.status).to.equal(302);

          var location = res.headers['location'];
          expect(location).to.be.a('string');
          var authorizationUrl = new URL(location);
          var callbackState = authorizationUrl.searchParams.get('state');
          expect(callbackState).to.be.a('string').and.not.to.equal('');
          bru.setVar('callbackState', callbackState);
          expect(location.split('?')[0]).to.equal(
            bru.getEnvVar('oidcIssuerUrl') + '/protocol/openid-connect/auth'
          );
          expect(location).to.include(
            'redirect_uri=' + encodeURIComponent(bru.getEnvVar('baseUrl') + '/v1/auth/callback')
          );
          expect(location).to.include('response_type=code');
          expect(location).to.include('client_id=lef-web-bff');
          expect(location).to.include('code_challenge_method=S256');
          expect(location).to.include('code_challenge=');
          expect(location).to.include('state=');
          expect(location).to.include('nonce=');
          expect(authorizationUrl.searchParams.has('destination')).to.equal(false);
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.headers['referrer-policy']).to.equal('no-referrer');
        });

        test('sets an HttpOnly login-state cookie', function() {
          var setCookie = [].concat(res.headers['set-cookie'] || []);
          var loginStateCookie = setCookie.find(function(cookie) {
            return cookie.indexOf('lef_login_state=') === 0;
          });

          expect(loginStateCookie).to.be.a('string');
          expect(loginStateCookie.toLowerCase()).to.include('httponly');
          var loginStateCookiePair = loginStateCookie.split(';')[0];
          expect(loginStateCookiePair).to.equal('lef_login_state=' + bru.getVar('callbackState'));
          bru.setVar('loginStateCookie', loginStateCookiePair);
          ['lef_session', 'lef_csrf_token'].forEach(function(name) {
            var cleared = setCookie.find(function(cookie) { return cookie.indexOf(name + '=;') === 0; });
            expect(cleared).to.be.a('string');
            expect(cleared).to.include('Path=/');
            expect(cleared).to.include('SameSite=Lax');
            expect(cleared).to.include('Expires=Thu, 01 Jan 1970 00:00:00 GMT');
            expect(cleared).not.to.include('Max-Age');
          });
        });
