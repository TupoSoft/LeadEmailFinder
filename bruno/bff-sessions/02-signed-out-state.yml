info:
    name: 02-signed-out-state
    type: http
    seq: 2

http:
    method: GET
    url: '{{baseUrl}}/v1/auth/sign-in-state'

settings:
    followRedirects: false

runtime:
    scripts:
        - type: tests
          code: |-
              test('returns only safe signed-out state', function() {
                expect(res.status).to.equal(200);
                expect(res.body).to.deep.equal({ state: 'signed_out' });
              });
              test('prevents caching and expires stale CSRF authority', function() {
                expect(res.headers['cache-control']).to.equal('no-store');
                expect(res.headers['referrer-policy']).to.equal('no-referrer');
                expect([].concat(res.headers['set-cookie'] || []).some(function(cookie) {
                  return cookie.startsWith('lef_csrf_token=;') && cookie.includes('Path=/');
                })).to.equal(true);
              });
