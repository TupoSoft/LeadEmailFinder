info:
    name: 10-browser-openapi-contract
    type: http
    seq: 10

http:
    method: GET
    url: '{{baseUrl}}/openapi.json'

runtime:
    scripts:
        - type: tests
          code: |-
              test('publishes only the reviewed browser operations and their authentication contract', function() {
                expect(res.status).to.equal(200);
                expect(res.headers['content-type']).to.include('application/json');
                expect(Object.keys(res.body.paths).sort()).to.deep.equal([
                  '/health', '/v1/auth/magic-link/verify', '/v1/auth/sign-in/magic-link', '/v1/auth/sign-out',
                  '/v1/billing/summary', '/v1/email-verifications', '/v1/email-verifications/{id}', '/v1/me'
                ]);
                expect(Object.keys(res.body.paths['/v1/billing/summary'])).to.deep.equal(['get']);
                expect(Object.keys(res.body.paths['/v1/email-verifications'])).to.deep.equal(['post']);
                expect(Object.keys(res.body.paths['/v1/email-verifications/{id}'])).to.deep.equal(['get']);
                expect(res.body.paths['/v1/email-verifications'].post.security).to.deep.equal([{ native_session: [] }]);
                expect(res.body.paths['/v1/me'].get.operationId).to.equal('getCurrentUser');
                expect(res.body.paths['/v1/me'].get.security).to.deep.equal([{ native_session: [] }]);
                expect(res.body.paths['/v1/auth/sign-out'].post.security).to.deep.equal([]);
                var request = res.body.paths['/v1/auth/sign-in/magic-link'].post;
                expect(request.security).to.deep.equal([]);
                expect(request.requestBody.content['application/json'].schema.required).to.deep.equal(['email']);
                expect(request.responses['200'].content['application/json'].schema.properties).to.deep.equal({
                  status: { type: 'boolean', enum: [true] }
                });
                var redemption = res.body.paths['/v1/auth/magic-link/verify'].get;
                expect(redemption.responses).not.to.have.property('200');
                expect(redemption.responses['302']).not.to.have.property('content');
                expect(redemption.responses['302'].headers).to.have.property('Location');
              });
