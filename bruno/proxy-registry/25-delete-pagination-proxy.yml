info:
  name: 25-delete-pagination-proxy
  type: http
  seq: 25
http:
  method: DELETE
  url: "{{baseUrl}}/v1/proxies/{{paginationProxyId}}"
  headers:
    - name: Authorization
      value: Bearer {{serviceClientToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test('deletes exactly the pagination fixture', async function() {
          expect(JSON.stringify(res.body ?? '')).not.to.match(/"(?:auth|user|pass)"\s*:/);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            expect(JSON.stringify(res.body ?? '')).not.to.include(bru.getVar(key));
          }
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('paginationProxyId'));
          expect(res.body.description).to.equal(bru.getVar('paginationFixtureDescription'));
        });
