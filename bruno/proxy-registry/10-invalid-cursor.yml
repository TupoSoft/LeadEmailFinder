info:
  name: 10-invalid-cursor
  type: http
  seq: 10
http:
  method: GET
  url: "{{baseUrl}}/v1/proxies?pageSize=1&pageToken=not-a-cursor"
  headers:
    - name: Authorization
      value: Bearer {{serviceClientToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects a malformed cursor without registry data', async function() {
          expect(JSON.stringify(res.body ?? '')).not.to.match(/"(?:auth|user|pass)"\s*:/);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            expect(JSON.stringify(res.body ?? '')).not.to.include(bru.getVar(key));
          }
          expect(res.status).to.equal(400);
          expect(res.body).not.to.have.property('proxies');
        });
