info:
  name: 04-invalid-create-null
  type: http
  seq: 4
http:
  method: POST
  url: "{{baseUrl}}/v1/proxies"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{serviceClientToken}}
  body:
    type: json
    data: |-
      {
        "protocol": 1,
        "host": "proxy.bruno.example.test",
        "port": 8080,
        "auth": null,
        "maxConcurrent": 1,
        "requestsPerMinute": 10,
        "description": "{{proxyFixtureDescription}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects null authentication without caching the error', async function() {
          expect(JSON.stringify(res.body ?? '')).not.to.match(/"(?:auth|user|pass)"\s*:/);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            expect(JSON.stringify(res.body ?? '')).not.to.include(bru.getVar(key));
          }
          expect(res.status).to.equal(400);
          expect(res.headers['cache-control']).to.equal('no-store');
        });
