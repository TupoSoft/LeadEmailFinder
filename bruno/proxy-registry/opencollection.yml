opencollection: 1.0.0
info:
  name: Proxy Registry
request:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('proxyFixtureDescription')) {
          const crypto = require('node:crypto');
          const suffix = crypto.randomUUID();
          bru.setVar('proxyFixtureDescription', 'Bruno proxy-registry ' + suffix);
          bru.setVar('paginationFixtureDescription', 'Bruno proxy-registry pagination ' + suffix);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            bru.setVar(key, 'synthetic-' + crypto.randomBytes(24).toString('hex'));
          }
        }
        if (!bru.getVar('serviceClientToken')) {
          const response = await fetch(`${bru.getEnvVar('oidcIssuerUrl')}/protocol/openid-connect/token`, {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'client_credentials',
              client_id: bru.getEnvVar('serviceClientId'),
              client_secret: bru.getEnvVar('serviceClientSecret'),
            }),
          });
          const payload = await response.json();
          if (!response.ok || !payload.access_token) {
            throw new Error(`Client Credentials token request failed with HTTP ${response.status}`);
          }
          bru.setVar('serviceClientToken', payload.access_token);
        }
