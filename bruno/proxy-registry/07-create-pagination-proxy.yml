info:
  name: 07-create-pagination-proxy
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/v1/proxies"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{serviceClientToken}}
  body:
    type: json
    data: |-
      {
        "protocol": 1,
        "host": "pagination.bruno.example.test",
        "port": 8081,
        "description": "{{paginationFixtureDescription}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        if (res.status === 201 && typeof res.body.id === 'string') bru.setVar('paginationProxyId', res.body.id);
        test('creates a second disabled fixture for cursor coverage', async function() {
          expect(JSON.stringify(res.body ?? '')).not.to.match(/"(?:auth|user|pass)"\s*:/);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            expect(JSON.stringify(res.body ?? '')).not.to.include(bru.getVar(key));
          }
          expect(res.status).to.equal(201);
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.body.id).to.be.a('string');
          expect(res.body.state).to.equal('disabled');
          expect(res.body.blacklists).to.deep.equal([]);
        });
