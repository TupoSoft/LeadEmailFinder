info:
  name: 06-create-proxy
  type: http
  seq: 6
http:
  method: POST
  url: "{{baseUrl}}/v1/proxies"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{serviceClientToken}}
  body:
    type: json
    data: |-
      {
        "protocol": 1,
        "host": "proxy.bruno.example.test",
        "port": 8080,
        "auth": {
          "user": "{{proxyUser}}",
          "pass": "{{proxyPassword}}"
        },
        "maxConcurrent": 1,
        "requestsPerMinute": 10,
        "description": "{{proxyFixtureDescription}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        if (res.status === 201 && typeof res.body.id === 'string') bru.setVar('proxyId', res.body.id);
        test('creates a uniquely labeled proxy disabled by default without credentials', async function() {
          expect(JSON.stringify(res.body ?? '')).not.to.match(/"(?:auth|user|pass)"\s*:/);
          for (const key of ['proxyUser', 'proxyPassword', 'replacementUser', 'replacementPassword']) {
            expect(JSON.stringify(res.body ?? '')).not.to.include(bru.getVar(key));
          }
          expect(res.status).to.equal(201);
          expect(res.headers['cache-control']).to.equal('no-store');
          expect(res.body.id).to.be.a('string');
          expect(res.body.state).to.equal('disabled');
          expect(res.body.maxConcurrent).to.equal(1);
          expect(res.body.requestsPerMinute).to.equal(10);
          expect(res.body.blacklists).to.deep.equal([]);
          expect(res.body.description).to.equal(bru.getVar('proxyFixtureDescription'));
        });
