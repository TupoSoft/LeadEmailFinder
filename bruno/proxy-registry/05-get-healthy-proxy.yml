info:
  name: 05-get-healthy-proxy
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies/healthy?mxHost=mx.bruno-smoke-test.example"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('selects a proxy without credentials', function() {
          expect(res.status).to.equal(200);
          expect(res.body).not.to.have.property('auth');
        });
