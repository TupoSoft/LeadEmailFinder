info:
  name: 04-get-proxy
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies/{{proxyId}}"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('returns the created proxy without credentials', function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('proxyId'));
          expect(res.body).not.to.have.property('auth');
        });
