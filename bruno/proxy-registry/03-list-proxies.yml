info:
  name: 03-list-proxies
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/proxies?pageSize=100"
  headers:
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('lists proxies without credentials', function() {
          expect(res.status).to.equal(200);
          expect(res.body.proxies).to.be.an('array');
          expect(res.body.proxies.some(proxy => proxy.id === bru.getVar('proxyId'))).to.equal(true);
          expect(res.body.proxies.every(proxy => !Object.prototype.hasOwnProperty.call(proxy, 'auth'))).to.equal(true);
        });
