info:
  name: 06-update-proxy
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/v1/proxies/{{proxyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "state": "draining"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('updates a proxy without credentials', function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('proxyId'));
          expect(res.body.state).to.equal('draining');
          expect(res.body).not.to.have.property('auth');
        });
