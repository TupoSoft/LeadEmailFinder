name: local
variables:
    - name: baseUrl
      value: '{{process.env.BRUNO_API_URL}}'
    - name: organizationId
      value: '{{process.env.BRUNO_ORGANIZATION_ID}}'
    - name: absentDuplicateOrganizationId
      value: '{{process.env.BRUNO_ABSENT_DUPLICATE_ORGANIZATION_ID}}'
    - name: absentDistinctOrganizationId
      value: '{{process.env.BRUNO_ABSENT_DISTINCT_ORGANIZATION_ID}}'
    - name: absentConflictOrganizationId
      value: '{{process.env.BRUNO_ABSENT_CONFLICT_ORGANIZATION_ID}}'
    - name: platformToken
      value: '{{process.env.BRUNO_PLATFORM_TOKEN}}'
    - name: customerToken
      value: '{{process.env.BRUNO_CUSTOMER_TOKEN}}'
    - name: setOrganizationId
      value: '{{process.env.BRUNO_SET_ORGANIZATION_ID}}'
    - name: heldOrganizationId
      value: '{{process.env.BRUNO_HELD_ORGANIZATION_ID}}'
    - name: unknownOrganizationId
      value: '{{process.env.BRUNO_UNKNOWN_ORGANIZATION_ID}}'
