info:
  name: 08-replay-platform-credits
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{platformToken}}"
    - name: Idempotency-Key
      value: "{{grantKey}}"
  body:
    type: json
    data: '{ "amount": 7 }'

runtime:
  scripts:
    - type: tests
      code: |-
        test('replay platform credits', function() {
          expect(res.status).to.equal(201);
          expect(res.body.balance).to.equal(7);
        });
