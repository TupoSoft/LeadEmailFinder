info:
  name: 06-repeated-idempotency-key
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{platformToken}}"
    - name: Idempotency-Key
      value: "{{repeatedRejectedKey}}, {{repeatedRejectedKey}}"
  body:
    type: json
    data: '{ "amount": 7 }'

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('repeatedRejectedKey')) {
          bru.setVar('repeatedRejectedKey', require('node:crypto').randomUUID());
        }
    - type: tests
      code: |-
        test('repeated idempotency key', function() {
          expect(res.status).to.equal(400);
        });
