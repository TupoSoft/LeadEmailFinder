info:
  name: 12-concurrent-distinct-adds
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{platformToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const { randomUUID } = require('node:crypto');
        const firstKey = randomUUID();
        const secondKey = randomUUID();
        const responses = await Promise.all([3,5].map((amount, index) => fetch(`${bru.getEnvVar('baseUrl')}/credits/${bru.getEnvVar('organizationId')}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${bru.getEnvVar('platformToken')}`, 'Idempotency-Key': index === 0 ? firstKey : secondKey },
          body: JSON.stringify({ amount }),
        })));
        bru.setVar('concurrentStatuses', responses.map(response => response.status).sort());
        bru.setVar('concurrentBalances', await Promise.all(responses.map(async response => (await response.json()).balance)));
    - type: tests
      code: |-
        test('concurrent distinct adds', function() {
          expect(res.status).to.equal(200);
          expect(bru.getVar('concurrentStatuses')).to.deep.equal([201, 201]);
          expect(res.body.balance).to.equal(26);
        });
