info:
  name: 03-missing-platform-permission
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{customerToken}}"
    - name: Idempotency-Key
      value: "{{forbiddenAuthKey}}"
  body:
    type: json
    data: '{ "amount": 7 }'

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('forbiddenAuthKey')) {
          bru.setVar('forbiddenAuthKey', require('node:crypto').randomUUID());
        }
    - type: tests
      code: |-
        test('missing platform permission', function() {
          expect(res.status).to.equal(403);
        });
