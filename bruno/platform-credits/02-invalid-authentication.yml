info:
  name: 02-invalid-authentication
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer invalid-token"
    - name: Idempotency-Key
      value: "{{invalidAuthKey}}"
  body:
    type: json
    data: '{ "amount": 7 }'

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('invalidAuthKey')) {
          bru.setVar('invalidAuthKey', require('node:crypto').randomUUID());
        }
    - type: tests
      code: |-
        test('invalid authentication', function() {
          expect(res.status).to.equal(401);
        });
