info:
  name: 10-conflict-preserves-balance
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/credits/{{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{platformToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('conflict preserves balance', function() {
          expect(res.status).to.equal(200);
          expect(res.body.balance).to.equal(7);
        });
