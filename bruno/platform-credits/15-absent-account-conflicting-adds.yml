info:
  name: 15-absent-account-conflicting-adds
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/credits/{{absentConflictOrganizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{platformToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const { randomUUID } = require('node:crypto');
        const firstKey = randomUUID();
        const secondKey = firstKey;
        const responses = await Promise.all([17,19].map((amount, index) => fetch(`${bru.getEnvVar('baseUrl')}/credits/${bru.getEnvVar('absentConflictOrganizationId')}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${bru.getEnvVar('platformToken')}`, 'Idempotency-Key': index === 0 ? firstKey : secondKey },
          body: JSON.stringify({ amount }),
        })));
        bru.setVar('concurrentStatuses', responses.map(response => response.status).sort());
        bru.setVar('concurrentBalances', await Promise.all(responses.map(async response => (await response.json()).balance)));
    - type: tests
      code: |-
        test('absent account conflicting adds', function() {
          expect(res.status).to.equal(200);
          expect(bru.getVar('concurrentStatuses')).to.deep.equal([201, 409]);
          expect([17, 19]).to.include(res.body.balance);
        });
