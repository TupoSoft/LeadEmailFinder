info:
  name: 03-malformed-oidc-token-rejected
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/api-keys"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer a.b.c"
  body:
    type: json
    data: |-
      {
        "permissions": ["read"]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('a JWT-shaped but invalid bearer token is rejected by the OIDC verification path', function() {
          expect(res.status).to.equal(401);
        });
