info:
  name: 02-missing-credential-rejected
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/api-keys"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "permissions": ["read"]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('the global auth guard rejects a request with no credential before any controller runs', function() {
          expect(res.status).to.equal(401);
        });
