info:
  name: 02-create-service-client-requires-org-membership
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/organizations/{{organizationId}}/service-clients"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"
  body:
    type: json
    data: |-
      {
        "permissions": ["verification:run"]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an actor whose organization does not match the target organization', function() {
          expect(res.status).to.equal(403);
        });
