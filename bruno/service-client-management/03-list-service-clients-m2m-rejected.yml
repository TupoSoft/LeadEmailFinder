info:
  name: 03-list-service-clients-m2m-rejected
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/organizations/{{organizationId}}/service-clients"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{serviceClientToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects an M2M credential before client management', function() {
          expect(res.status).to.equal(403);
          expect(Object.prototype.hasOwnProperty.call(res.body || {}, 'clientSecret')).to.equal(false);
        });
