info:
    name: reject-insufficient-credit
    type: http
    seq: 15
http:
    method: POST
    url: '{{baseUrl}}/v1/email-verifications'
    headers:
        - name: Authorization
          value: 'Bearer {{customerToken}}'
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {"email": "insufficient-funds-check@lef.test"}
runtime:
    scripts:
        - type: before-request
          code: |-
              // A never-before-submitted address, so this genuinely exercises the zero-balance admission check
              // rather than racing the 60-second cooldown a just-settled inconclusive address would still carry.
              const response = await fetch(`${bru.getEnvVar('baseUrl')}/credits/${bru.getEnvVar('organizationId')}`, {
                method: 'PUT',
                headers: { Authorization: `Bearer ${bru.getVar('platformToken')}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 0 }),
              });
              if (!response.ok) throw new Error('Fixture balance reset failed');
        - type: tests
          code: |-
              test('reject-insufficient-credit', function() {
                expect(res.status).to.equal(402);
                expect(res.body.message).to.equal('insufficient_credits');
              });
