info:
    name: confirm-cooldown-preserved-credit
    type: http
    seq: 11
http:
    method: GET
    url: '{{baseUrl}}/v1/billing/summary'
    headers:
        - name: Authorization
          value: 'Bearer {{customerToken}}'
runtime:
    scripts:
        - type: tests
          code: |-
              test('confirm-cooldown-preserved-credit', function() {
                // The fixture result releases its hold; subsequent rejected requests must preserve that balance.
                expect(res.status).to.equal(200);
                expect(res.body.balance).to.equal(Number(bru.getVar('singleVerificationStartingBalance')));
                expect(res.body.reserved).to.equal(0);
              });
