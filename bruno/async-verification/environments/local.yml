name: local
variables:
    - name: baseUrl
      value: http://localhost:53000
    - name: oidcIssuerUrl
      value: '{{process.env.OIDC_ISSUER_URL}}'
    - name: organizationId
      value: '{{process.env.CUSTOMER_ORGANIZATION_ID}}'
    - name: platformApiKey
      value: '{{process.env.PLATFORM_API_KEY}}'
    - name: customerApiKey
      value: '{{process.env.CUSTOMER_API_KEY}}'
