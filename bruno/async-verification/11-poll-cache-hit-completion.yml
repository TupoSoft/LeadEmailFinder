info:
    name: poll-cache-hit-completion
    type: http
    seq: 11
http:
    method: GET
    url: '{{baseUrl}}/verifyAsync/{{cacheHitJobId}}'
    headers:
        - name: Authorization
          value: 'Bearer {{customerToken}}'
runtime:
    scripts:
        - type: tests
          code: |-
              test('poll-cache-hit-completion', function() {
                expect(res.status).to.equal(200);
                expect(res.body.state).to.equal('completed');
                expect(res.body.result).to.deep.equal(bru.getVar('completedResult'));
                const operation = res.body.operation;
                expect(operation.id).to.equal(bru.getVar('cacheHitJobId'));
                expect(operation.source).to.equal('cache');
                expect(operation.billing).to.deep.equal({ state: 'settled', reserved: 0, charged: 0, reason: 'cached' });
              });
