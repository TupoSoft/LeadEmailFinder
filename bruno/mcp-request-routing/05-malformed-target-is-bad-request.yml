info:
  name: 05-malformed-target-is-bad-request
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}//"

runtime:
  scripts:
    - type: tests
      code: |-
        test('a malformed request target is rejected with the exact bad_request body', function() {
          expect(res.status).to.equal(400);
          expect(res.headers['content-type']).to.include('application/json');
          expect(res.body).to.eql({ status: 'bad_request' });
        });
