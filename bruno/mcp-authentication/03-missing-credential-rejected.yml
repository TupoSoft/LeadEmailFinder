info:
  name: 03-missing-credential-rejected
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-06-18",
          "capabilities": {},
          "clientInfo": { "name": "bruno", "version": "0.0.0" }
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('a missing credential is rejected', function() {
          expect(res.status).to.equal(401);
          expect(res.body).to.eql({ error: 'authentication_required' });
        });
