opencollection: 1.0.0

info:
  name: MCP Authentication

request:
  scripts:
    - type: before-request
      code: |-
        const apiKey = bru.getEnvVar('mcpAuthApiKey');
        if (!apiKey) throw new Error('MCP_AUTH_API_KEY is required');
        bru.setVar('authValid', `Bearer ${apiKey}`);
        bru.setVar('authWrong', `Bearer ${apiKey.slice(0, -1)}${apiKey.endsWith('A') ? 'B' : 'A'}`);
        bru.setVar('authEmpty', 'Bearer ');
