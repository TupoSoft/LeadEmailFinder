info:
  name: 03-reject-read-key
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/api-keys/permissions:check"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{managedKeyToken}}"
  body:
    type: json
    data: |-
      {
        "token": "{{managedKeyToken}}",
        "requiredPermissions": ["read"]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects a non-admin key from key administration', function() {
          expect(res.status).to.equal(403);
        });
