info:
  name: 02-create-read-key
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/api-keys"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Api-Key
      value: "{{adminApiKey}}"
  body:
    type: json
    data: |-
      {
        "permissions": ["read"],
        "description": "Bruno API-key administration smoke test"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('creates a read key with an admin key', function() {
          expect(res.status).to.equal(201);
          expect(res.body.apiKey.token).to.be.a('string');
          expect(res.body.apiKey.permissions).to.deep.equal(['read']);
          bru.setVar('managedKeyToken', res.body.apiKey.token);
        });
