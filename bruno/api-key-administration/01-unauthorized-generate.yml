info:
  name: 01-unauthorized-generate
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/api-keys"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "permissions": ["read"]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects key generation without an API key', function() {
          expect(res.status).to.equal(401);
        });
