info:
  name: 05-revoke-read-key
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/v1/api-keys/{{managedKeyToken}}"
  headers:
    - name: X-Api-Key
      value: "{{adminApiKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('revokes the smoke-test key with an admin key', function() {
          expect(res.status).to.equal(200);
          expect(res.body.apiKey.token).to.equal(bru.getVar('managedKeyToken'));
        });
