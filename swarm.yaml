version: '3.9'

services:
  verifier: &verifier
    image: kyrylokupin/email-verifier-node:e9691b251d029260f973f2ed6f0d318a68e92863
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
    environment:
      MONGO_URL_FILE: /run/secrets/mongo_url
    deploy:
      mode: global
    networks:
      - default
      - mongo_default
      - redis_default
    secrets:
      - mongo_url

  verifier_v2:
    <<: *verifier
    image: ghcr.io/tuposoft/leademailfinder:9af49325056ba8c564f6ea6d44fbc1bc8bb95dbc
    environment:
      REDIS_CONFIG_FILE_PATH: /run/secrets/redis-config.json
    secrets:
      - source: redis-config
        target: redis-config.json

secrets:
  mongo_url:
    external: true
  redis-config:
    external: true

networks:
  default:
  mongo_default:
    external: true
  redis_default:
    external: true
