syntax = "proto3";

package api_key;

import "google/protobuf/wrappers.proto";

message ValidateKeyForRolesRequest {
  string token = 1;
  repeated string requiredPermissions = 2;
}

service ApiKeyService {
  rpc ValidateKeyForRoles(ValidateKeyForRolesRequest) returns (google.protobuf.BoolValue);
}
