services:
  verifier:
    build:
      context: .
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
      - 8.8.8.8
      - 8.8.4.4
      - 2001:4860:4860::8888
      - 2001:4860:4860::8844
    scale: 2
    healthcheck:
      test: curl -f http://localhost:3000/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.<unique_router_name>.rule=Host(`dev.leademailfinder.com`) && PathPrefix(`/`)"
      - traefik.http.routers.<unique_router_name>.entryPoints=http
  
  redis:
    image: redis:alpine
    healthcheck:
      test: redis-cli ping
