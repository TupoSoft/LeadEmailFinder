syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc SendOtp(SendOtpRequest) returns (SendOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  rpc LoginWithProvider(LoginWithProviderRequest) returns (LoginWithProviderResponse);
}

message UserInfo {
  string id = 1;
  string email = 2;
  string username = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message RegisterResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message LoginRequest {
  oneof credential {
    string email = 1;
    string username = 2;
  }
  string password = 3;
}

message LoginResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message IntrospectTokenRequest {
  string token = 1;
}

message IntrospectTokenResponse {
  bool active = 1;
  string scope = 2;
  string client_id = 3;
  string username = 4;
  string token_type = 5;
  google.protobuf.Timestamp exp = 6;
  google.protobuf.Timestamp iat = 7;
  google.protobuf.Timestamp nbf = 8;
  string sub = 9;
  string aud = 10;
  string iss = 11;
  string jti = 12;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}

message SendOtpRequest {
  oneof destination {
    string email = 1;
    string phone = 2;
  }
  string purpose = 3;
}

message SendOtpResponse {
  bool success = 1;
  string otp_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message VerifyOtpRequest {
  string otp_id = 1;
  string code = 2;
}

message VerifyOtpResponse {
  bool success = 1;
  bool verified = 2;
}

message LoginWithProviderRequest {
  string provider = 1;
  string code = 2;
  string redirect_uri = 3;
}

message LoginWithProviderResponse {
  UserInfo user = 1;
  string access_token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool is_new_user = 5;
}
