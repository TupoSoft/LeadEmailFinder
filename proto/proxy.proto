syntax = "proto3";

package proxy;

service ProxyService {
  rpc GetHealthyProxy(GetHealthyProxyRequest) returns (GetHealthyProxyResponse);
  rpc ReportBlacklist(ReportBlacklistRequest) returns (Empty);
}

message GetHealthyProxyRequest {
  string mxHost = 1;
}

message GetHealthyProxyResponse {
  string id = 1;
  string protocol = 2;
  string host = 3;
  uint32 port = 4;
  optional Auth auth = 5;
  uint32 weight = 6;
  optional string region = 7;
}

message Auth {
  string user = 1;
  string pass = 2;
}

message ReportBlacklistRequest {
  string proxyId = 1;
  string mxHost = 2;
  int32 backoffMs = 3;
}

message Empty {}
