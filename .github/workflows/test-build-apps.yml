name: Test and Build Apps

on:
  push:
    branches:
      - master
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  assert-diff-within-limit:
    uses: TupoSoft/GitHubActions/.github/workflows/check-pr-lines.yml@master
    if: github.event_name == 'pull_request'
    with:
      max_lines: 500
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      changed_apps: ${{ steps.set-outputs.outputs.changed_apps }}
      changed_libs: ${{ steps.set-outputs.outputs.changed_libs }}
      any_app_changed: ${{ steps.filter.outputs.any-app-changed }}
      any_lib_changed: ${{ steps.filter.outputs.any-lib-changed }}
      any_change: ${{ steps.filter.outputs.any-change }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect apps and libraries
        id: set-projects
        run: .github/workflows/scripts/set-projects.sh

      - name: Generate filters
        id: generate-filters
        run: .github/workflows/scripts/generate-filters.sh '${{ steps.set-projects.outputs.apps }}' '${{ steps.set-projects.outputs.libraries }}'

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ steps.generate-filters.outputs.filters }}

      - name: Set outputs
        id: set-outputs
        run: |
          FILTER_OUTPUTS='${{ toJSON(steps.filter.outputs) }}'

          APPS='${{ steps.set-projects.outputs.apps }}'
          LIBRARIES='${{ steps.set-projects.outputs.libraries }}'

          CHANGED_APPS="[]"
          CHANGED_LIBS="[]"
          
          for LIB in $(echo "$LIBRARIES" | jq -r '.[]'); do
            if [[ `echo "$FILTER_OUTPUTS" | jq -r --arg lib "$LIB" '.[$lib + "-lib"]'` == "true" ]]; then
              CHANGED_LIBS=$(echo "$CHANGED_LIBS" | jq -c --arg lib "$LIB" '. += [$lib]')
          
              for CONSUMER in `grep -R -l "from ['\"]@tuposoft/lead-email-finder/$LIB['\"]" apps/ | cut -d '/' -f2 | sort -u`; do
                CHANGED_APPS=`echo "$CHANGED_APPS" | jq -c --arg app $CONSUMER '. += [$app]'`
              done
            fi
          done
          
          for APP in $(echo "$APPS" | jq -r '.[]'); do
            if [[ `echo "$FILTER_OUTPUTS" | jq -r --arg app "$APP" '.[$app]'` == "true" ]]; then
              CHANGED_APPS=$(echo "$CHANGED_APPS" | jq -c --arg app "$APP" '. += [$app]')
            fi
          done
          
          CHANGED_APPS=`echo "$CHANGED_APPS" | jq -c 'unique'`
          CHANGED_LIBS=`echo $CHANGED_LIBS | jq -c 'unique'`

          echo "changed_apps=$CHANGED_APPS" >> $GITHUB_OUTPUT
          echo "changed_libs=$CHANGED_LIBS" >> $GITHUB_OUTPUT

          echo "Changed apps: $CHANGED_APPS"
          echo "Changed libraries: $CHANGED_LIBS"

  test-changed-libs:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_lib_changed == 'true'
    strategy:
      matrix:
        lib: ${{ fromJSON(needs.detect-changes.outputs.changed_libs) }}
    permissions:
      contents: read
    uses: TupoSoft/GitHubActions/.github/workflows/node-test.yml@master
    with:
      test_path: ./libs/${{ matrix.lib }}

  test-changed-apps:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app_changed == 'true'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.changed_apps) }}
    permissions:
      contents: read
    uses: TupoSoft/GitHubActions/.github/workflows/node-test.yml@master
    with:
      test_path: ./apps/${{ matrix.app }}

  build-changed-apps:
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.changed_apps) }}
    needs: test-changed-apps
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: TupoSoft/GitHubActions/.github/workflows/build-push.yml@master
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      image-name: ${{ matrix.app }}

  summary:
    needs:
      - detect-changes
      - test-changed-libs
      - test-changed-apps
    if: always() && needs.detect-changes.outputs.any_change == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize changes
        run: |
          echo "## Build and Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Components" >> $GITHUB_STEP_SUMMARY

          CHANGED_LIBS='${{ needs.detect-changes.outputs.changed_libs }}'
          CHANGED_APPS='${{ needs.detect-changes.outputs.changed_apps }}'

          if [[ "$CHANGED_LIBS" != "[]" ]]; then
            echo "#### Libraries:" >> $GITHUB_STEP_SUMMARY
            for LIB in $(echo "$CHANGED_LIBS" | jq -r '.[]'); do
              echo "- ✅ $LIB" >> $GITHUB_STEP_SUMMARY
            done
          fi

          if [[ "$CHANGED_APPS" != "[]" ]]; then
            echo "#### Applications:" >> $GITHUB_STEP_SUMMARY
            for APP in $(echo "$CHANGED_APPS" | jq -r '.[]'); do
              echo "- ✅ $APP" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY

          # Report on libraries test job
          if [[ "${{ needs.test-libs.result }}" != "skipped" ]]; then
            echo "- Libraries Test: ${{ needs.test-libs.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- Applications Test and Build:" >> $GITHUB_STEP_SUMMARY

          APPS='${{ needs.detect-projects.outputs.apps }}'

          for APP in $(echo "$APPS" | jq -r '.[]'); do
            if [[ "$CHANGED_APPS" == *"$APP"* ]] || [[ "${{ needs.detect-changes.outputs.any_lib_changed }}" == "true" ]]; then
              APP_STATUS="${{ needs.test-build-apps.result }}"
              echo "  - $APP: $APP_STATUS" >> $GITHUB_STEP_SUMMARY
            fi
          done
