name: Test, Build, Push

on:
  push:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  pull_request:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  workflow_dispatch:

jobs:
  assert-diff-within-limit:
    uses: TupoSoft/GitHubActions/.github/workflows/check-pr-lines.yml@master
    if: github.event_name == 'pull_request'
    with:
      max_lines: 500
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
  
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  build-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    uses: TupoSoft/GitHubActions/.github/workflows/build-push.yml@master
    permissions:
      packages: write
      contents: read
