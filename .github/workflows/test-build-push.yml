name: Test, Build, Push

on:
  push:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  pull_request:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  workflow_dispatch:

jobs:
  assert-diff-within-limit:
    uses: TupoSoft/GitHubActions/.github/workflows/check-pr-lines.yml@master
    if: github.event_name == 'pull_request'
    with:
      max_lines: 500
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  get-changed-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get changed apps
        id: set-matrix
        run: |
          {
            echo 'apps<<EOF'
            pnpm list --filter '...[origin/master]' --filter '!monorepo' --depth=-1 --json
            echo EOF
          } >> "$GITHUB_OUTPUT"

  test:
    needs: get-changed-apps
    if: needs.get-changed-apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.get-changed-apps.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter ${{ matrix.app.name }} install

      - name: Run tests
        run: pnpm --filter ${{ matrix.app.name }} test

  build-push:
    name: Build Push
    needs: [ get-changed-apps ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.get-changed-apps.outputs.apps) }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prepare_tags
        run: |
          REPOSITORY=${{ github.repository }}
          REPOSITORY=${REPOSITORY,,}
          APP=${{ matrix.app.name }}
          GITHUB_SHA=${{ github.sha }}
          PACKAGE="ghcr.io/$REPOSITORY-$APP"
          TAGS="$PACKAGE:$GITHUB_SHA"
          if [ ${{ github.ref_name }} == "master" ]; then
            TAGS="$TAGS,$PACKAGE:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          
          PATH=${{ matrix.app.path }}
          CONTEXT="${PATH#*/LeadEmailFinder/LeadEmailFinder/}"
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:apps/api"
          tags: ${{ steps.prepare_tags.outputs.tags }}
          push: true
