name: Test, Build, Push

on:
  push:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  pull_request:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
      - Dockerfile
  workflow_dispatch:

jobs:
  assert-diff-within-limit:
    uses: TupoSoft/GitHubActions/.github/workflows/check-pr-lines.yml@master
    if: github.event_name == 'pull_request'
    with:
      max_lines: 500
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  get-changed-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get changed apps
        id: set-matrix
        run: |
          apps=`pnpm list --filter '...[origin/master]' --filter '!monorepo' --depth=-1 --json`
          echo "apps=$apps" >> $GITHUB_OUTPUT
  
  test:
    needs: get-changed-apps
    if: needs.get-changed-apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.get-changed-apps.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter ${{ matrix.app.name }} install

      - name: Run tests
        run: pnpm --filter ${{ matrix.app.name }} test

  build-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    uses: TupoSoft/GitHubActions/.github/workflows/build-push.yml@master
    permissions:
      packages: write
      contents: read
    secrets: inherit
