name: Node.js Test Runner

on:
  push:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.ts'
      - '**/*.js'

jobs:
  assert-diff-within-limit:
    uses: TupoSoft/GitHubActions/.github/workflows/check-pr-lines.yml@master
    with:
      max_lines: 500
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
  
  test:
    runs-on: ubuntu-latest
    needs: assert-diff-within-limit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  build-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get repository name
        id: repo_name
        run: |
          REPOSITORY=${{ github.repository }}
          REPOSITORY=${REPOSITORY,,}
          echo "repo_name=$REPOSITORY" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repo_name }}:latest
            ghcr.io/${{ steps.repo_name.outputs.repo_name }}:${{ github.sha }}
