name: Sync ExecPlans

on:
  push:
    branches:
      - master
    paths:
      - '.agents/plans/**'
      - 'scripts/plans/**'
      - '.github/workflows/sync-execplans.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report planned changes without writing to GitHub'
        type: boolean
        default: false

permissions:
  contents: read

# Two overlapping runs could both observe a missing issue and create duplicates, which the
# body marker cannot undo after the fact.
concurrency:
  group: sync-execplans
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: >-
          corepack pnpm --filter @tuposoft/lead-email-finder...
          install --frozen-lockfile

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gh

      - name: Sync ExecPlans to the project board
        env:
          # The default GITHUB_TOKEN cannot write organization-level Projects v2; this must be a
          # classic PAT with the project scope, a fine-grained token with organization project
          # write, or a GitHub App token.
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLANS_PROJECT_OWNER: TupoSoft
          PLANS_PROJECT_NUMBER: '9'
          PLANS_BRANCH: master
          PLANS_DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: corepack pnpm plans:sync
