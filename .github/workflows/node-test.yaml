name: Node.js Test Runner

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.js'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9.11.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test
