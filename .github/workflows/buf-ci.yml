name: Buf CI
on:
  push:
    paths:
      - 'proto/**/*.proto'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'proto/**/*.proto'
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on:
      - self-hosted
      - ubuntu-22
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          push: false
