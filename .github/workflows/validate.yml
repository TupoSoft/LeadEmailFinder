name: Validate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lef_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lef_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Type check
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test:ci

      - name: Test empty-database synchronization
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/lef_identity_test
        run: corepack pnpm test -- identity-schema.integration.spec.ts --runInBand

      - name: Test credit account debits against a real database
        env:
          TEST_CREDITS_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/lef_identity_test
        run: corepack pnpm test -- credits.service.integration.spec.ts --runInBand

      - name: Build application
        run: corepack pnpm build

      - name: Build production image
        run: docker build --tag lead-email-finder:ci .
