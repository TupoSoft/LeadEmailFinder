openapi: 3.1.1
info:
  title: Lead Email Finder
  description: Lead Email Finder
  version: 1.1.0
servers:
  - url: 'http://localhost:3000'
    description: local development
  - url: 'https://p1.leademailfinder.com'
    description: production
paths:
  /verify?email={email}:
    get:
      tags:
        - email
      description: Verify a single email.
      parameters:
        - name: email
          in: path
          description: The email to verify.
          required: true
          allowEmptyValue: false
          schema:
            type: string
      responses:
        200:
          description: The email was successfully verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerification'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
components:
  schemas:
    ValidationFailed:
      description: The client sent a bad request.
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              type:
                type: string
                minLength: 1
                example: field
              value:
                type: string
                minLength: 1
                example: john.doe
              msg:
                type: string
                minLength: 1
                example: Invalid value
              path:
                type: string
                minLength: 1
                example: email
              location:
                type: string
                minLength: 1
                example: query
      required:
        - errors

    EmailVerification:
      type: object
      properties:
        localPart:
          type: string
          minLength: 1
          example: john.doe
        domain:
          type: string
          minLength: 1
          example: gmail.com
        email:
          type: string
          minLength: 1
          example: john.doe@gmail.com
        error:
          type: string
          minLength: 1
          example: TemporarilyBlocked
        mxDomain:
          type: string
          minLength: 1
          example: gmail.com
        source:
          type: string
          minLength: 1
          description: The source that confirmed the existance of an email.
          example: SMTP
          enum:
            - SMTP
            - MicrosoftGetCredentialType
            - MicrosoftLogin
            - MimecastLogin
            - OfficeApps
            - LinkedInLogin
            - None
        success:
          type: boolean
          description: Whether the source confirmed or denied the existence.
          example: true
        targetExchange:
          type: string
          minLength: 1
          description: The mail exchange that was used for SMTP communication.
          example: gmail-smtp-in.l.google.com
        verifiedAt:
          type: string
          minLength: 1
          description: The date of verification.
      required:
        - localPart
        - domain
        - email
        - source
        - success



